<!DOCTYPE html>
<html lang="ko" data-mode="subtle">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지구 연표 — 황혼 샘플</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --paper:oklch(99.2% 0.005 95);
    --ink:oklch(36% 0.013 75);
    --ink-soft:oklch(36% 0.013 75 / .55);
    --line:oklch(93.5% 0.012 92);
    /* 황혼 팔레트 */
    --sky-top:oklch(30% 0.07 288);      /* 남보라 밤 */
    --sky-mid:oklch(52% 0.065 330);     /* 붉은 자주 놀 */
    --sky-glow:oklch(84% 0.085 62);     /* 지평선 금빛 */
    --mtn:oklch(30% 0.04 165);          /* 산 실루엣 (짙은 솔) */
    --mtn-far:oklch(46% 0.035 200);     /* 먼 능선 */
    --crest:oklch(88% 0.07 75);         /* 능선 림라이트 */
    --lake:oklch(58% 0.07 250);         /* 호수 */
    --lake-deep:oklch(34% 0.06 262);
    --sea:oklch(28% 0.05 262);          /* 밤바다 (글) */
    --sun:oklch(80% 0.14 55);
    --moon:oklch(93% 0.02 95);
    --star:oklch(88% 0.08 85);          /* 별 — 사람 */
    --cloud:oklch(74% 0.045 340);       /* 놀에 물든 구름 — 학업 */
    --bloom:oklch(80% 0.09 15);         /* 산 위의 꽃 */
    --seed:oklch(80% 0.07 85);          /* 씨앗 — 학업 */
    --earth:oklch(36% 0.045 55);        /* 표토 — 놀빛이 스민 흙 */
    --earth-deep:oklch(24% 0.035 45);   /* 심토 */
    --cream:oklch(94% 0.015 90);        /* 밝은 라벨 */
    --cream-soft:oklch(94% 0.015 90 / .62);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);
    font-family:'Pretendard Variable',Pretendard,sans-serif;line-height:1.6;
    padding:34px clamp(16px,3vw,44px) 60px}
  h1{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:.01em}
  .sub{color:var(--ink-soft);font-size:13.5px;margin-top:6px}
  .modes{display:flex;gap:6px;margin:22px 0 10px}
  .chip{font-family:inherit;font-size:12.5px;padding:4px 13px;border-radius:999px;cursor:pointer;
    border:1px solid transparent;background:transparent;color:var(--ink);opacity:.55;transition:.15s}
  .chip:hover{opacity:.9}
  .chip.on{opacity:1;border-color:var(--line);background:oklch(97.6% 0.008 95);font-weight:600}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin:8px 2px 14px}
  .legend b{color:var(--ink);font-weight:600}
  svg{display:block;width:100%;border-radius:16px}
  .cap{margin-top:14px;font-size:12.5px;color:var(--ink-soft)}
</style>
</head>
<body>
  <h1>지구 연표 — 황혼</h1>
  <div class="sub">행복은 산맥, 마이너스는 호수. 해와 달과 별이 함께 뜬 저녁. 익명 예시 데이터.</div>
  <div class="modes">
    <button class="chip on" data-mode="subtle">a. 옅은 황혼</button>
    <button class="chip" data-mode="scene">b. 깊은 황혼</button>
  </div>
  <div class="legend">
    <span><b>분류가 층을 정한다</b></span>
    <span>✦ <b>별</b> = 사람 (맨 위)</span><span>⦿ <b>씨앗</b> = 학업 (꽃 아래 땅속)</span>
    <span>❀ <b>꽃</b> = 좋은 일 (산 위)</span><span>◌ <b>물결</b> = 힘든 일 (호수에 가라앉은 자리)</span>
    <span>☁ = 생각</span><span>〜 <b>밤바다</b> = 월별 글</span><span>☀ 해 = 오늘 · ☾ 달·별 공존</span>
  </div>
  <svg id="c" aria-label="지구 연표 황혼 샘플"></svg>
  <div class="cap" id="cap"></div>
<script>
/* ── 익명 샘플 데이터 ───────────────────────────────────────── */
const EVENTS=[ /* [연도, 행복, 분류, 이름] — people=별 띠 · study=구름 띠 · 무표=산/호수 */
  [1995.0,  0.1,'','태어나다'],
  [2001.2,  0.35,'people','첫 친구'],
  [2004.0,  0.2,'study','첫 시험'],
  [2005.5,  0.3,'','작은 성취'],
  [2009.1, -0.3,'','긴 방황'],
  [2011.3, -0.15,'study','재수 생활'],
  [2013.1,  0.5,'study','대학 입학'],
  [2014.2,  0.42,'people','독립과 사람들'],
  [2017.6,  0.8,'','긴 여행'],
  [2019.8, -0.62,'','슬럼프'],
  [2020.9,  0.3,'study','새 언어 공부'],
  [2021.4,  0.15,'','새 일'],
  [2023.0,  0.55,'people','귀한 인연'],
  [2024.6,  0.9,'people','평생의 벗'],
  [2025.8, -0.2,'','작은 부침'],
  [2027.2,  0.6,'','다음 목표']
];
const THOUGHTS=[[2010.8,'낯선 거리에서야 내 속도를'],[2020.9,'길이 끝난 게 아니라 지도가']];
const HAP=[[1995,0],[2000,.2],[2004,.28],[2007,-.05],[2009,-.35],[2011,-.2],[2013,.15],[2015,.3],[2017.6,.6],
  [2019,-.1],[2019.8,-.5],[2021,.2],[2022.5,.42],[2024,.3],[2025.5,.28],[2027,.5],[2028,.55]];
const NOW=2026.6;
const RECS=[];{let s=7;for(let t=1995;t<=2028.4;t+=1/12){s=(s*16807)%2147483647;
  const base=t>2015? .55:.25, k=(s/2147483647);
  RECS.push([t, Math.max(0, base + .45*Math.sin((t-1995)*1.7) * k)]);}}

/* ── 렌더 ──────────────────────────────────────────────────── */
const svg=document.getElementById('c');
const NS='http://www.w3.org/2000/svg';
const el=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
const T0=1994.2,T1=2028.8;
let W=1200;
const H=470, SKY_T=46, ZERO=258, LAKE_B=356, SEA_T=392, SEA_B=452;
const X=t=>(t-T0)/(T1-T0)*W;
const VAL_TOP=SKY_T+62; /* +1 상한 — 별 띠 아래 */
const yOf=v=>v>=0? ZERO - v*(ZERO-VAL_TOP) : ZERO + (-v)*(LAKE_B-ZERO);
const hapAt=t=>{ /* 곡선 값 보간 — 씨앗을 지표 바로 아래 심기 위해 */
  if(t<=HAP[0][0])return HAP[0][1];
  for(let i=1;i<HAP.length;i++)if(HAP[i][0]>=t){
    const a=HAP[i-1],b=HAP[i];
    return a[1]+(b[1]-a[1])*((t-a[0])/(b[0]-a[0]||1));
  }
  return HAP[HAP.length-1][1];
};

function smooth(p){
  if(p.length<3)return 'M '+p.map(q=>q[0]+' '+q[1]).join(' L ');
  const n=p.length,dx=[],m=[];
  for(let i=0;i<n-1;i++){const h=Math.max(p[i+1][0]-p[i][0],1e-6);dx.push(h);m.push((p[i+1][1]-p[i][1])/h);}
  const t=[m[0]];
  for(let i=1;i<n-1;i++){ if(m[i-1]*m[i]<=0)t.push(0);
    else{const w1=2*dx[i]+dx[i-1],w2=dx[i]+2*dx[i-1];t.push((w1+w2)/(w1/m[i-1]+w2/m[i]));} }
  t.push(m[n-2]);
  let d=`M ${p[0][0]} ${p[0][1]}`;
  for(let i=0;i<n-1;i++){const h=dx[i];
    d+=` C ${p[i][0]+h/3} ${p[i][1]+t[i]*h/3}, ${p[i+1][0]-h/3} ${p[i+1][1]-t[i+1]*h/3}, ${p[i+1][0]} ${p[i+1][1]}`;}
  return d;
}
const flower=(x,y,r,col)=>{
  const g=el('g',{});
  for(let i=0;i<5;i++){const a=i/5*Math.PI*2-Math.PI/2;
    g.appendChild(el('circle',{cx:x+Math.cos(a)*r,cy:y+Math.sin(a)*r,r:r*.78,fill:col,opacity:.9}));}
  g.appendChild(el('circle',{cx:x,cy:y,r:r*.6,fill:'var(--sky-glow)',opacity:.95}));
  return g;
};
const star=(x,y,r,col)=>{
  const p=`M ${x} ${y-r} Q ${x+r*.18} ${y-r*.18} ${x+r} ${y} Q ${x+r*.18} ${y+r*.18} ${x} ${y+r}
           Q ${x-r*.18} ${y+r*.18} ${x-r} ${y} Q ${x-r*.18} ${y-r*.18} ${x} ${y-r} Z`;
  return el('path',{d:p,fill:col});
};
const cloudShape=(x,y,s,fill,op)=>{
  const g=el('g',{});
  [[0,0,10],[-9,3,7.5],[9,3,7.5],[0,4,9]].forEach(([dx,dy,r])=>
    g.appendChild(el('ellipse',{cx:x+dx*s/10,cy:y+dy*s/10,rx:r*s/10,ry:r*s/10*.78,fill:fill,opacity:op})));
  return g;
};

function render(){
  W=svg.clientWidth||1200;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.setAttribute('height',H);
  svg.innerHTML='';
  const scene=document.documentElement.dataset.mode==='scene';
  const defs=el('defs',{});

  /* 하늘: 남보라 → 놀 → 지평선 금빛 */
  const sky=el('linearGradient',{id:'sky',x1:0,x2:0,gradientUnits:'userSpaceOnUse',y1:0,y2:ZERO});
  sky.appendChild(el('stop',{offset:'0%','stop-color':'var(--sky-top)','stop-opacity':scene?1:.88}));
  sky.appendChild(el('stop',{offset:'55%','stop-color':'var(--sky-mid)','stop-opacity':scene?.95:.8}));
  sky.appendChild(el('stop',{offset:'100%','stop-color':'var(--sky-glow)','stop-opacity':scene?.98:.9}));
  const mtn=el('linearGradient',{id:'mtn',x1:0,x2:0,gradientUnits:'userSpaceOnUse',y1:VAL_TOP,y2:ZERO});
  mtn.appendChild(el('stop',{offset:'0%','stop-color':'var(--mtn)','stop-opacity':.92}));
  mtn.appendChild(el('stop',{offset:'100%','stop-color':'var(--mtn)','stop-opacity':scene?1:.96}));
  const lake=el('linearGradient',{id:'lake',x1:0,x2:0,gradientUnits:'userSpaceOnUse',y1:ZERO,y2:LAKE_B});
  lake.appendChild(el('stop',{offset:'0%','stop-color':'var(--lake)','stop-opacity':.95}));
  lake.appendChild(el('stop',{offset:'100%','stop-color':'var(--lake-deep)','stop-opacity':1}));
  const seaG=el('linearGradient',{id:'seaG',x1:0,x2:0,gradientUnits:'userSpaceOnUse',y1:SEA_T,y2:SEA_B});
  seaG.appendChild(el('stop',{offset:'0%','stop-color':'var(--sea)','stop-opacity':.55}));
  seaG.appendChild(el('stop',{offset:'100%','stop-color':'var(--sea)','stop-opacity':.95}));
  defs.appendChild(sky);defs.appendChild(mtn);defs.appendChild(lake);defs.appendChild(seaG);
  svg.appendChild(defs);

  /* 배경판 */
  const earth=el('linearGradient',{id:'earth',x1:0,x2:0,gradientUnits:'userSpaceOnUse',y1:ZERO,y2:SEA_T+18});
  earth.appendChild(el('stop',{offset:'0%','stop-color':'var(--earth)','stop-opacity':.96}));
  earth.appendChild(el('stop',{offset:'55%','stop-color':'var(--earth-deep)','stop-opacity':.98}));
  earth.appendChild(el('stop',{offset:'100%','stop-color':'var(--sea)','stop-opacity':1}));
  defs.appendChild(earth);
  svg.appendChild(el('rect',{x:0,y:0,width:W,height:ZERO,fill:'url(#sky)'}));
  svg.appendChild(el('rect',{x:0,y:ZERO,width:W,height:H-ZERO,fill:'url(#earth)'}));
  /* 지층 결 — 흙의 단면임을 속삭이는 물결 줄 */
  {const strata=scene?[26,54,86,120]:[34,72,112];
   strata.forEach((dy,i)=>{
     const pts2=[];for(let px=0;px<=W;px+=90)
       pts2.push([px,ZERO+dy+Math.sin(px/140+i*2.1)*3.5]);
     svg.appendChild(el('path',{d:smooth(pts2),fill:'none',stroke:'var(--cream)',
       'stroke-width':.55,opacity:scene?.11:.08}));});}
  svg.appendChild(el('rect',{x:0,y:SEA_T-6,width:W,height:H-SEA_T+6,fill:'url(#seaG)'}));

  /* 별하늘 — 위쪽 전역에 옅게 (위로 갈수록 또렷) */
  {let sd=13;const n=scene?90:48;
   for(let i=0;i<n;i++){sd=(sd*16807)%2147483647;const rx=sd/2147483647;
     sd=(sd*16807)%2147483647;const ry=sd/2147483647;
     sd=(sd*16807)%2147483647;const rr=sd/2147483647;
     const y=Math.max(8,SKY_T-30+ry*(VAL_TOP-SKY_T+10));
     svg.appendChild(el('circle',{cx:rx*W,cy:y,r:.6+rr*1.1,
       fill:'var(--star)',opacity:(scene?.7:.5)*(1-ry*.6)}));}}

  /* 달 — 초승달, 왼쪽 위 */
  {const mx=W*.16,my=SKY_T+16,r=scene?13:11;
   svg.appendChild(el('circle',{cx:mx,cy:my,r:r,fill:'var(--moon)',opacity:.95}));
   svg.appendChild(el('circle',{cx:mx+r*.42,cy:my-r*.18,r:r*.86,fill:'var(--sky-top)',opacity:.92}));
   if(scene)svg.appendChild(el('circle',{cx:mx,cy:my,r:r+7,fill:'var(--moon)',opacity:.1}));}

  /* 연도 눈금 */
  for(let y=1995;y<=2028;y+=5){
    const x=X(y);
    svg.appendChild(el('line',{x1:x,x2:x,y1:SKY_T,y2:SEA_B,stroke:'var(--cream)','stroke-width':.7,'stroke-dasharray':'2 8',opacity:.22}));
    const t=el('text',{x:x,y:SKY_T-16,'text-anchor':'middle','font-size':11,fill:'var(--cream-soft)','font-family':'ui-monospace,monospace'});
    t.textContent=y;svg.appendChild(t);
  }

  /* 해 — 오늘, 지평선에 낮게 */
  const nx=X(NOW);
  svg.appendChild(el('line',{x1:nx,x2:nx,y1:SKY_T-4,y2:SEA_B,stroke:'var(--sun)','stroke-width':1,'stroke-dasharray':'4 6',opacity:.6}));
  svg.appendChild(el('circle',{cx:nx,cy:ZERO-13,r:scene?11:9,fill:'var(--sun)',opacity:.98}));
  svg.appendChild(el('circle',{cx:nx,cy:ZERO-13,r:scene?22:16,fill:'var(--sun)',opacity:.16}));
  if(scene)svg.appendChild(el('rect',{x:nx-1.2,y:ZERO,width:2.4,height:LAKE_B-ZERO,fill:'var(--sun)',opacity:.18}));

  /* 분류 띠 */
  const BAND_STAR={top:SKY_T+4,bot:SKY_T+40};
  [['사람',BAND_STAR]].forEach(([nm,b])=>{
    const t=el('text',{x:8,y:(b.top+b.bot)/2+3,'font-size':10,fill:'var(--cream-soft)',
      'font-family':'ui-monospace,monospace','letter-spacing':'.18em'});
    t.textContent=nm;svg.appendChild(t);
    svg.appendChild(el('line',{x1:0,x2:W,y1:b.bot+8,y2:b.bot+8,stroke:'var(--cream)','stroke-width':.6,
      'stroke-dasharray':'3 11',opacity:.2}));
  });

  /* 산맥 + 호수 */
  const pts=HAP.map(([t,v])=>[X(t),yOf(v)]);
  const past=pts.filter((p,i)=>HAP[i][0]<=NOW);
  const fut=pts.filter((p,i)=>HAP[i][0]>=NOW-1);
  const dPast=smooth(past);
  const area=dPast+` L ${past[past.length-1][0]} ${ZERO} L ${past[0][0]} ${ZERO} Z`;
  const cpUp=el('clipPath',{id:'up'});cpUp.appendChild(el('rect',{x:0,y:0,width:W,height:ZERO}));
  const cpDn=el('clipPath',{id:'dn'});cpDn.appendChild(el('rect',{x:0,y:ZERO,width:W,height:H-ZERO}));
  defs.appendChild(cpUp);defs.appendChild(cpDn);
  const farPts=past.map(p=>[p[0]+14,Math.min(p[1]+26,ZERO)]);
  svg.appendChild(el('path',{d:smooth(farPts)+` L ${farPts[farPts.length-1][0]} ${ZERO} L ${farPts[0][0]} ${ZERO} Z`,
    fill:'var(--mtn-far)',opacity:scene?.5:.38,'clip-path':'url(#up)'}));
  svg.appendChild(el('path',{d:area,fill:'url(#mtn)','clip-path':'url(#up)'}));
  svg.appendChild(el('path',{d:dPast,fill:'none',stroke:'var(--crest)','stroke-width':scene?2:1.6,
    'stroke-linecap':'round','clip-path':'url(#up)',opacity:.95}));
  svg.appendChild(el('path',{d:area,fill:'url(#lake)','clip-path':'url(#dn)'}));
  svg.appendChild(el('line',{x1:0,x2:W,y1:ZERO,y2:ZERO,stroke:'var(--sky-glow)',opacity:.75,'stroke-width':1.1}));
  svg.appendChild(el('path',{d:smooth(past.map(p=>[p[0],Math.min(p[1]+12,LAKE_B)])),
    fill:'none',stroke:'var(--cream)','stroke-width':.55,opacity:.18,'clip-path':'url(#dn)'}));
  if(scene){
    [24,38].forEach(dy=>svg.appendChild(el('path',{d:smooth(past.map(p=>[p[0],Math.min(p[1]+dy,LAKE_B)])),
      fill:'none',stroke:'var(--cream)','stroke-width':.5,opacity:.12,'clip-path':'url(#dn)'})));
    const mx=W*.16;
    svg.appendChild(el('ellipse',{cx:mx,cy:ZERO+22,rx:9,ry:2.2,fill:'var(--moon)',opacity:.22,'clip-path':'url(#dn)'}));
    svg.appendChild(el('ellipse',{cx:mx,cy:ZERO+34,rx:6,ry:1.6,fill:'var(--moon)',opacity:.14,'clip-path':'url(#dn)'}));
  }
  if(scene){ /* 큰 봉우리의 뿌리 — 산과 흙이 한 몸임을 */
    [[2017.6,.6],[2024,.3]].forEach(([pt,pv])=>{
      const px=X(pt);
      [[-14,34,-22],[0,46,4],[13,30,20]].forEach(([dx0,len,dx1])=>{
        svg.appendChild(el('path',{d:`M ${px+dx0} ${ZERO+2} Q ${px+dx0+dx1*.4} ${ZERO+len*.55} ${px+dx0+dx1} ${ZERO+len}`,
          stroke:'var(--cream)','stroke-width':.6,fill:'none',opacity:.13}));});
    });
  }
  svg.appendChild(el('path',{d:smooth(fut),fill:'none',stroke:'var(--cream)','stroke-width':1.4,'stroke-dasharray':'6 6',opacity:.55}));

  /* 밤바다 — 월별 글 */
  const wave=[[0,SEA_B]];
  RECS.forEach(([t,n])=>wave.push([X(t),SEA_T+(1-n)*(SEA_B-SEA_T)*.8+6]));
  wave.push([W,SEA_B]);
  svg.appendChild(el('path',{d:smooth(wave)+` L ${W} ${SEA_B} L 0 ${SEA_B} Z`,fill:'var(--sea)',opacity:scene?.9:.75}));
  svg.appendChild(el('path',{d:smooth(wave),fill:'none',stroke:'var(--cream)','stroke-width':.7,opacity:.25}));
  const seaLb=el('text',{x:10,y:SEA_B-8,'font-size':10,fill:'var(--cream-soft)','font-family':'ui-monospace,monospace'});
  seaLb.textContent='월별 글';svg.appendChild(seaLb);

  /* 생각 — 작은 구름에 매달린 문장 */
  THOUGHTS.forEach(([t,txt],i)=>{
    const x=X(t), y=SKY_T+58+(i%2)*16;
    svg.appendChild(cloudShape(x,y,7.5,'var(--cloud)',.8));
    const q=el('text',{x:x,y:y+18,'text-anchor':'middle','font-size':10.5,fill:'var(--cream-soft)'});
    q.textContent='❝ '+txt.slice(0,10)+'…';svg.appendChild(q);
  });

  /* 사건 — 분류가 층을 정한다 */
  const inBand=(b,v)=>b.bot-((v+1)/2)*(b.bot-b.top);
  EVENTS.forEach(([t,v,cat,name])=>{
    const x=X(t), cy=yOf(v);
    if(cat==='people'){ /* 별 — 맨 위 띠, 실은 능선까지 */
      const y=inBand(BAND_STAR,v);
      const gy=yOf(hapAt(t));
      svg.appendChild(el('line',{x1:x,y1:y+9,x2:x,y2:gy-4,
        stroke:'var(--cream)','stroke-width':.5,'stroke-dasharray':'2 6',opacity:.25}));
      svg.appendChild(el('circle',{cx:x,cy:gy,r:1.7,fill:'var(--cream)',opacity:.5}));
      svg.appendChild(star(x,y,scene?9:8,'var(--star)'));
      if(scene)svg.appendChild(el('circle',{cx:x,cy:y,r:12,fill:'var(--star)',opacity:.12}));
      const lt=el('text',{x:x,y:y+21,'text-anchor':'middle','font-size':10.5,fill:'var(--cream)'});
      lt.textContent=name;svg.appendChild(lt);
      return;
    }
    if(cat==='study'){ /* 씨앗 — 꽃 아래 땅속 (지표를 따라 심김) */
      const sy=yOf(hapAt(t))+16;
      const g=el('g',{});
      g.appendChild(el('ellipse',{cx:x,cy:sy,rx:3.4,ry:4.6,fill:'var(--seed)',stroke:'var(--sky-glow)','stroke-width':.8,opacity:.98}));
      g.appendChild(el('path',{d:`M ${x} ${sy-4.6} Q ${x+1.6} ${sy} ${x} ${sy+4.6}`,
        stroke:'var(--sky-glow)','stroke-width':.7,fill:'none',opacity:.6}));
      svg.appendChild(g);
      const lt=el('text',{x:x,y:sy+17,'text-anchor':'middle','font-size':10.5,fill:'var(--cream-soft)'});
      lt.textContent=name;svg.appendChild(lt);
      return;
    }
    if(v>=0){ /* 꽃 — 능선 위에 그대로 얹는다 */
      const gy=yOf(Math.max(hapAt(t),0))-3;
      svg.appendChild(flower(x,gy,scene?5.4:4.8,'var(--bloom)'));
      const lt=el('text',{x:x,y:gy-13,'text-anchor':'middle','font-size':11,fill:'var(--cream)'});
      lt.textContent=name;svg.appendChild(lt);
    }else{ /* 힘든 일 — 수면의 파문 + 가라앉은 깊이 */
      svg.appendChild(el('ellipse',{cx:x,cy:ZERO+2,rx:7,ry:2.1,fill:'none',stroke:'var(--cream)','stroke-width':.9,opacity:.55}));
      svg.appendChild(el('ellipse',{cx:x,cy:ZERO+2,rx:13,ry:3.6,fill:'none',stroke:'var(--cream)','stroke-width':.55,opacity:.28}));
      svg.appendChild(el('line',{x1:x,y1:ZERO+6,x2:x,y2:cy-3,stroke:'var(--cream)','stroke-width':.5,'stroke-dasharray':'2 5',opacity:.3}));
      svg.appendChild(el('circle',{cx:x,cy:cy,r:1.8,fill:'var(--cream)',opacity:.65}));
      const lt=el('text',{x:x,y:cy+15,'text-anchor':'middle','font-size':11,fill:'var(--cream-soft)'});
      lt.textContent=name;svg.appendChild(lt);
    }
  });

  document.getElementById('cap').textContent=
    scene
    ? 'b. 깊은 황혼 — 지층 결이 늘고 큰 봉우리 아래 뿌리가 내린다. 달빛 반영·해기둥·잔물결도 진해진다.'
    : 'a. 옅은 황혼 — 호수 아래는 흙의 단면(지층). 씨앗은 그 흙에 묻히고, 깊어질수록 어두워지다 밤바다로 이어진다.';
}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  document.documentElement.dataset.mode=b.dataset.mode;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
addEventListener('resize',render);
render();
</script>
</body>
</html>
