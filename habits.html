<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7FB" />
    <meta name="referrer" content="same-origin" />
    <link rel="icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="assets/platform.css" />
    <link rel="stylesheet" href="assets/haedo-shell.css" />
    <meta name="robots" content="noindex" />
    <title>습관 · 해도</title>
  </head>
  <body class="platform haedo-shell" data-haedo-section="tools" data-page="habits">
    <a class="skip-link" href="#content">본문으로 이동</a>
    <nav class="haedo-nav" data-haedo-navigation aria-label="주 메뉴"></nav>

    <div id="accessState" class="p-access" role="status">
      <p>로그인을 확인하고 있습니다.</p>
      <a href="login.html">로그인 화면</a
      ><button id="accessRetry" class="p-button" hidden>다시 확인</button>
    </div>
    <noscript
      ><p class="p-access">
        JavaScript를 허용해야 개인 공간을 열 수 있습니다.
      </p></noscript
    >
    <main id="content" class="p-main private-main" data-private hidden>
      <header class="haedo-page-heading">
        <div class="haedo-heading-title">
          <a class="haedo-icon-button" href="index.html?section=tools" data-section-back aria-label="도구로 돌아가기"><span data-haedo-icon="back" aria-hidden="true"></span></a>
          <h1>습관</h1>
        </div>
        <div class="haedo-heading-actions">
          <button id="syncRetry" class="haedo-icon-button" aria-label="동기화 다시 확인"><span data-haedo-icon="cloud" aria-hidden="true"></span></button>
          <button id="addItem" class="haedo-icon-button" aria-label="습관 추가"><span data-haedo-icon="plus" aria-hidden="true"></span></button>
          <a class="haedo-icon-button" href="login.html" data-login-link aria-label="로그인"><span data-haedo-icon="user" aria-hidden="true"></span></a>
      <details class="haedo-account" data-account-menu hidden>
        <summary class="haedo-icon-button" aria-label="계정 메뉴"><span data-haedo-icon="user" aria-hidden="true"></span></summary>
        <div class="haedo-account-panel">
          <p id="accountLabel" class="p-account"></p>
          <a class="p-text-link" href="index.html?section=manage">관리</a>
          <button class="p-button" data-logout hidden type="button">로그아웃</button>
        </div>
      </details>
        </div>
      </header>
      <div class="p-status-line"><span id="syncMessage" role="status">기기 사본을 확인합니다.</span></div>
      <div class="p-list-tools">
        <p id="habitWeekLabel"></p>
        <span id="itemCount"></span>
      </div>
      <div id="habitList" class="habit-list"></div>
      <p class="p-muted habit-note">
        정한 요일에만 체크할 수 있습니다. 지난 7일의 완료 기록도 수정할 수
        있습니다.
      </p>
    </main>
    <dialog id="itemDialog" class="p-dialog" aria-labelledby="itemDialogTitle">
      <form id="itemForm">
        <div class="p-dialog-head">
          <h2 id="itemDialogTitle">목표 추가</h2>
          <button
            type="button"
            data-close="itemDialog"
            class="p-icon-button"
            aria-label="닫기"
          ><span data-haedo-icon="close" aria-hidden="true"></span></button>
        </div>
        <label
          >이름<input
            id="itemTitle"
            required
            maxlength="120"
            autocomplete="off"
        /></label>
        <div id="goalFields">
          <label
            >마감일 <span class="p-muted">선택</span
            ><input id="goalTarget" type="date" /></label
          ><label
            >진행률<input
              id="goalProgress"
              type="number"
              min="0"
              max="100"
              step="1"
              value="0"
              required
          /></label>
        </div>
        <div id="habitFields" hidden>
          <fieldset>
            <legend>반복 요일</legend>
            <div class="day-options" id="habitDays"></div>
          </fieldset>
          <p class="p-muted">완료한 날을 체크하면 연속 실천 횟수가 쌓입니다.</p>
        </div>
        <p id="itemFormMessage" class="p-message" role="alert"></p>
        <div class="p-dialog-actions">
          <button type="button" id="deleteItem" class="p-text-link" hidden>
            삭제</button
          ><button type="button" data-close="itemDialog" class="p-button">
            취소</button
          ><button type="submit" class="p-button primary">저장</button>
        </div>
      </form>
    </dialog>
    <dialog id="importDialog" class="p-dialog" aria-label="기존 연표 연결">
      <div class="p-dialog-head">
        <h2>기존 연표 연결</h2>
        <button
          data-close="importDialog"
          class="p-icon-button"
          aria-label="닫기"
        ><span data-haedo-icon="close" aria-hidden="true"></span></button>
      </div>
      <p id="legacySummary"></p>
      <p>
        백업을 내려받은 뒤 내 계정에 사본을 만듭니다. 기기의 원본은 그대로
        남습니다.
      </p>
      <button id="legacyBackup" class="p-button">백업 다운로드</button
      ><label class="ownership-check"
        ><input type="checkbox" id="legacyOwnership" />이 기기에 저장된 연표는
        내 기록입니다.</label
      >
      <p id="legacyMessage" class="p-message" role="status"></p>
      <div class="p-dialog-actions">
        <button id="legacyImport" class="p-button primary" disabled>
          내 계정에 사본 만들기
        </button>
      </div>
    </dialog>
    <dialog
      id="conflictDialog"
      class="p-dialog"
      aria-label="두 기기의 변경 사항"
    >
      <div class="p-dialog-head">
        <h2>두 기기의 변경 사항</h2>
        <button
          data-close="conflictDialog"
          class="p-icon-button"
          aria-label="닫기"
        ><span data-haedo-icon="close" aria-hidden="true"></span></button>
      </div>
      <p>
        같은 항목이 다른 기기에서도 바뀌었습니다. 백업을 내려받고 사용할 사본을
        선택하세요.
      </p>
      <button id="conflictBackup" class="p-button">백업 다운로드</button>
      <p id="conflictMessage" class="p-message" role="status"></p>
      <div class="p-dialog-actions">
        <button id="useRemote" class="p-button" disabled>서버 사본 사용</button
        ><button id="useLocal" class="p-button primary" disabled>
          기기 사본 사용
        </button>
      </div>
    </dialog>
    <div id="platformToast" class="p-toast" role="status" hidden></div>
    <footer class="p-footer">
      <a href="privacy.html">개인정보 안내</a>
    </footer>
    <script src="vendor/supabase/supabase.js"></script>
    <script src="assets/platform-config.js"></script>
    <script src="assets/platform-auth.js"></script>
    <script src="assets/data.js"></script>
    <script src="assets/sync.js"></script>
    <script src="assets/platform-data.js"></script>
    <script src="assets/platform-store.js"></script>
    <script src="assets/life/icons.js"></script>
    <script src="assets/haedo-navigation.js"></script>
    <script src="assets/platform-ui.js"></script>
  </body>
</html>
