<!DOCTYPE html>
<html lang="ko" data-theme="spring">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="행복도 곡선 위에 사건·기간·시대를 기록하는 개인 연표 편집기">
<meta name="theme-color" content="#FAF8F0">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>인생 연표</title>

<link rel="stylesheet" href="vendor/daisyui.css">
<link rel="stylesheet" href="vendor/daisyui-themes.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@400&family=Noto+Serif+KR:wght@900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip-link" href="#sec-canvas">기록으로 이동</a>
<nav class="app-bar" aria-label="문서 도구">
  <a class="app-brand" href="./" aria-label="인생 연표 홈"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 24h26M4 20c5 0 5-11 10-11s5 7 9 7 4-5 6-7"/></svg><span>인생 연표</span></a>
  <div class="edit-tools" aria-label="실행 취소">
    <button class="icon-button" id="btnUndo" title="되돌리기 (⌘/Ctrl+Z)" aria-label="되돌리기" disabled>↶</button>
    <button class="icon-button" id="btnRedo" title="다시 실행 (⌘/Ctrl+Shift+Z)" aria-label="다시 실행" disabled>↷</button>
  </div>
  <div class="document-tools">
    <select class="select select-sm select-ghost" id="docSel" title="문서 전환" aria-label="문서 선택"></select>
    <button class="bar-button" id="btnNewDoc">＋ 새 문서</button>
    <button class="bar-button" id="btnFile" aria-haspopup="menu">파일 <span aria-hidden="true">⌄</span></button>
  </div>
  <div class="save-state"><span id="saveStatus" role="status">기기에 저장됨</span><button class="db-dot" id="btnCloud" title="동기화 설정" aria-label="동기화 설정"></button></div>
</nav>

<noscript><div style="max-width:1180px;margin:24px auto;padding:16px 24px;border:1px solid #B5432A;color:#B5432A;font-size:14px">
이 페이지는 JavaScript로 그려진다. 브라우저에서 JavaScript를 허용해야 연표·지도가 표시된다.
</div></noscript>

<header>
  <div class="wrap">
    <div class="hgroup">
      <div>
        <h1>내 연표</h1>
        <p class="subtitle">시간에 따른 행복도와 사건 기록</p>
      </div>
      <div class="head-right">
        <div class="hero" id="hero">
          <button class="hero-fig" id="heroFig" aria-label="요약 수치 — 눌러서 다음">
            <span class="hero-k" id="heroK">행복도</span>
            <span class="hero-v" id="heroV">—</span>
          </button>
          <div class="hero-dots" id="heroDots" role="group" aria-label="수치 고르기"></div>
        </div>
        <div class="stat-cards" aria-label="기록 요약">
          <div class="stat"><div class="stat-title">출생</div><div class="stat-value" id="statBirth">—</div></div>
          <div class="stat"><div class="stat-title">사건 · 기간</div><div class="stat-value" id="statEvents">—</div></div>
        </div>
      </div>
    </div>
  </div>
</header>

<main>
  <section id="sec-canvas">
    <div class="wrap">

      <div class="workspace-toolbar">
        <div class="workspace-main">
          <div class="view-switch" role="group" aria-label="보기 방식">
            <button id="btnTimeline" class="on" aria-pressed="true">연표</button>
            <button id="btnRecords" aria-pressed="false">기록</button>
          </div>
          <div class="workspace-actions">
            <button class="lay-chip" id="btnSearch" title="검색 (⌘/Ctrl+K)">검색 <kbd>⌘ K</kbd></button>
            <button class="lay-chip add-chip" id="btnAdd" aria-label="추가">＋ 추가</button>
          </div>
        </div>
        <div class="tl-controls" role="group" aria-label="연표 보기 설정">
          <div class="scale-group" role="group" aria-label="표시 기간">
            <button class="lay-chip scale" data-y="all" aria-pressed="false">전체</button>
            <button class="lay-chip scale" data-y="20" aria-pressed="false">20년</button>
            <button class="lay-chip scale" data-y="10" aria-pressed="false">10년</button>
            <button class="lay-chip scale on" data-y="5" aria-pressed="true">5년</button>
            <button class="lay-chip scale" data-y="1" aria-pressed="false">1년</button>
          </div>
          <button class="bar-button" id="btnToday">오늘</button>
          <span class="toolbar-spacer"></span>
          <div class="view-tools">
            <button class="lay-chip" id="btnMap" aria-pressed="false">지도</button>
            <button class="lay-chip" id="btnGrid" aria-pressed="false">격자</button>
            <button class="lay-chip" id="btnShow" aria-label="설정" aria-haspopup="true">설정</button>
          </div>
        </div>
      </div>

      <div class="layer-bar" id="layerBar" aria-label="그래프 레이어 선택"></div>

      <div class="canvas-frame" id="chartView">
        <div class="canvas-inner">
          <svg id="tl" tabindex="0" role="application" aria-label="가로형 연표. ⌘ 또는 Ctrl과 휠로 확대, 드래그 또는 좌우 화살표로 이동, 0으로 전체 보기, 더블클릭으로 그 자리에 추가"></svg>
          <div class="tl-tip" id="tlTip"></div>
          <aside class="start-guide" id="startGuide" hidden aria-label="연표 사용 안내">
            <button class="start-close" id="startClose" aria-label="안내 닫기">×</button>
            <strong>첫 기록을 추가해보세요.</strong>
            <p>날짜와 내용을 남기면 연표에 바로 표시됩니다.</p>
            <div class="start-actions">
              <button class="lay-chip add-chip" id="startAdd">＋ 추가</button>
              <button class="guide-link" id="startDismiss">안내 닫기</button>
            </div>
          </aside>
          <!-- 지도 오버레이 — 연표 프레임 그 자리에서 펼쳐진다 -->
          <div class="map-overlay" id="mapOverlay" hidden>
            <div class="map-ov-bar">
              <div class="trip-bar" id="tripBar" role="group" aria-label="경로 선택"></div>
              <span style="flex:1"></span>
              <button class="lay-chip" id="mapShow" aria-label="지도에 무엇을 보일지">⋯</button>
              <button class="lay-chip" id="mapClose" aria-label="지도 닫기">✕</button>
            </div>
            <div id="map"></div>
            <div class="trip-info" id="tripInfo"></div>
          </div>
        </div>

        <!-- 스크러버 (미니맵) -->
        <div class="scrubber">
          <div class="scrub-track" id="scrubTrack" aria-label="타임라인 미니맵 — 클릭·드래그로 이동"></div>
          <span class="scrub-year" id="scrubYear">—</span>
        </div>

        <!-- 생애 격자 — 연표 아래 띠. 가로가 시간, 위가 시대 -->
        <div class="grid-band" id="gridBand" hidden>
          <div class="grid-bar">
            <span class="grid-note" id="gridNote"></span>
            <span style="flex:1"></span>
            <button class="lay-chip" id="gridShow" aria-label="격자 설정">⋯</button>
            <button class="lay-chip" id="gridClose" aria-label="격자 닫기">✕</button>
          </div>
          <canvas id="gridCv"></canvas>
          <div class="tl-tip" id="gridTip"></div>
        </div>

        <div class="chart-help"><span>기록을 누르면 편집할 수 있어요.</span><span>드래그로 이동 · ⌘/Ctrl + 휠로 확대</span></div>
      </div>
      <div class="records-view" id="recordsView" hidden>
        <div class="records-head"><div><h2>기록</h2><p id="recordCount"></p></div>
          <div class="record-filters"><input id="recordQuery" type="search" placeholder="제목이나 내용 검색" aria-label="목록 검색">
          <select id="recordKind" aria-label="기록 종류"><option value="all">모든 기록</option><option value="event">사건</option><option value="span">기간</option><option value="thought">생각</option></select></div>
        </div>
        <div id="recordRows"></div>
      </div>
    </div>
  </section>

</main>
<input type="file" id="fileRestore" accept=".json,application/json" hidden>
<div class="toast-message" id="toastMessage" role="status" hidden></div>

<!-- 입장 게이트 -->
<div id="gateBd" hidden style="position:fixed;inset:0;z-index:2000;background:var(--paper);display:flex;align-items:center;justify-content:center">
  <div style="display:flex;flex-direction:column;gap:14px;width:min(320px,86vw);text-align:center">
    <div style="font-weight:700;font-size:26px">인생 연표</div>
    <input id="gatePw" aria-label="입장 비밀번호" type="password" autocomplete="off"
      style="font-family:'IBM Plex Mono',monospace;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:var(--field);color:var(--ink);text-align:center">
    <button id="gateGo" class="btn btn-sm btn-primary" style="padding:9px">입장</button>
  </div>
</div>

<!-- 온라인 DB 설정 -->
<div class="search-bd" id="cloudBd" hidden>
  <div class="search-panel card bg-base-100" role="dialog" aria-modal="true" aria-label="온라인 DB 동기화" style="max-width:460px">
    <div style="display:flex;flex-direction:column;gap:12px;padding:20px 22px">
      <div style="font-weight:700;font-size:17px">☁ 온라인 DB 동기화</div>
      <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-soft)">Project URL
        <input id="cloudUrl" placeholder="https://xxxx.supabase.co" spellcheck="false"
          style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:var(--field);color:var(--ink)">
      </label>
      <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-soft)">공개 키 (publishable / anon)
        <input id="cloudKey" type="password" placeholder="sb_publishable_..." autocomplete="off" spellcheck="false"
          style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:var(--field);color:var(--ink)">
      </label>
      <p class="connection-note">계정별 접근 권한이 설정된 프로젝트를 연결하세요. <a href="https://supabase.com/docs/guides/database/postgres/row-level-security" target="_blank" rel="noopener">접근 권한 안내 ↗</a></p>
      <div style="border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:9px">
        <div style="font-size:11px;color:var(--ink-soft)">계정 로그인 (선택)</div>
        <div id="authStat" style="font-size:12px;color:var(--water-deep)"></div>
        <div id="authForm" style="display:flex;flex-direction:column;gap:8px">
          <input id="authEmail" type="email" placeholder="이메일" autocomplete="username"
            style="font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:var(--field);color:var(--ink)">
          <input id="authPw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password"
            style="font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:var(--field);color:var(--ink)">
          <div style="display:flex;gap:8px;justify-content:flex-end">
            <button class="btn btn-xs" id="authSignup">가입</button>
            <button class="btn btn-sm btn-primary" id="authLogin">로그인</button>
          </div>
        </div>
        <button class="btn btn-xs" id="authLogout" hidden>로그아웃</button>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-xs btn-error btn-soft" id="cloudOff">연결 해제</button>
        <button class="btn btn-xs" id="cloudCancel">닫기</button>
        <button class="btn btn-sm btn-primary" id="cloudSave">연결</button>
      </div>
    </div>
  </div>
</div>

<!-- 새 문서 만들기 -->
<div class="search-bd" id="fillBd" hidden>
  <div class="search-panel card bg-base-100" role="dialog" aria-modal="true" aria-label="채우기" style="max-width:640px">
    <div style="display:flex;flex-direction:column;gap:12px;padding:18px 20px">
      <div class="fill-tabs" role="tablist">
        <button class="lay-chip fill-tab on" data-tab="thought">생각</button>
        <button class="lay-chip fill-tab" data-tab="layer">분야 값</button>
        <button class="lay-chip fill-tab" data-tab="record">기록 밀도</button>
        <button class="lay-chip fill-tab" data-tab="tag">사건 태그</button>
      </div>
      <div id="fillPaste" style="display:flex;flex-direction:column;gap:9px">
        <div class="fill-row">
          <select class="dt-edit" id="fillLayer" aria-label="분야" hidden></select>
          <label class="dt-lab"><input type="checkbox" id="fillOver"> 이미 있는 달은 덮어쓴다</label>
          <span style="flex:1"></span>
          <label class="btn btn-xs" style="cursor:pointer">파일<input type="file" id="fillFile" accept=".txt,.tsv,.csv" hidden></label>
        </div>
        <textarea id="fillText" class="dt-edit" spellcheck="false" aria-label="붙여넣기"
          style="min-height:168px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.5"></textarea>
        <div id="fillPrev" style="font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;white-space:pre-line;min-height:34px"></div>
      </div>
      <div id="fillTag" hidden style="max-height:330px;overflow-y:auto"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-xs" id="fillCancel">닫기</button>
        <button class="btn btn-sm btn-primary" id="fillGo">넣기</button>
      </div>
    </div>
  </div>
</div>
<div class="search-bd" id="newBd" hidden>
  <div class="search-panel card bg-base-100" role="dialog" aria-modal="true" aria-label="새 문서 만들기" style="max-width:400px">
    <div style="display:flex;flex-direction:column;gap:13px;padding:20px 22px">
      <div style="font-weight:700;font-size:17px">새 문서 만들기</div>
      <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-soft)">이름
        <input id="nbName" placeholder="이름" style="font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:var(--field);color:var(--ink)">
      </label>
      <label style="display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-soft)">출생 연월
        <input id="nbBirth" type="text" inputmode="numeric" placeholder="1998-05(-05)" style="font-family:'IBM Plex Mono',monospace;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:2px;background:var(--field);color:var(--ink)">
      </label>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-xs" id="nbCancel">취소</button>
        <button class="btn btn-sm btn-primary" id="nbStart">만들기</button>
      </div>
    </div>
  </div>
</div>

<!-- 컨텍스트 메뉴 -->
<div class="ctx" id="ctxMenu" hidden></div>
<div class="ctx show-panel" id="showPanel" role="group" aria-label="표시" hidden></div>
<div class="ctx show-panel" id="mapPanel" role="group" aria-label="지도 표시" hidden></div>
<div class="ctx show-panel" id="gridPanel" role="group" aria-label="격자 설정" hidden></div>

<!-- 팝오버 에디터 -->
<div class="pop-ed" id="popEd" hidden role="dialog" aria-label="바로 편집"></div>

<!-- 호버 설명 카드 -->
<div class="hover-card" id="hoverCard" hidden aria-hidden="true"></div>

<!-- 검색 오버레이 -->
<div class="search-bd" id="searchBd" hidden>
  <div class="search-panel card bg-base-100" role="dialog" aria-modal="true" aria-label="기록 검색">
    <div class="search-row">
      <span aria-hidden="true">🔍</span>
      <input id="searchInput" aria-label="기록 검색" placeholder="이름 · 문장 · 날짜" spellcheck="false" autocomplete="off">
      <kbd>esc</kbd>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>


<script src="assets/data.js"></script>
<script src="assets/sync.js"></script>
<script src="assets/app.js"></script>
<script src="assets/workspace.js"></script>
</body>
</html>
