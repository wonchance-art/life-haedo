<!doctype html>
<html lang="ko" data-theme="spring">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="선택한 기록을 가져와 원문과 출처를 보존하고 발췌를 모으는 개인 생활 도구">
  <meta name="theme-color" content="#FFFFFF">
  <title>자료 모아보기 · 해도</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/life/ui.css">
  <link rel="stylesheet" href="assets/life/workbench.css">
  <link rel="stylesheet" href="assets/haedo-shell.css">
</head>
<body class="haedo-shell" data-page="life" data-haedo-section="records">
  <nav class="haedo-nav" data-haedo-navigation aria-label="주 메뉴"></nav>
  <div id="lifeAccountHost" class="haedo-account-host">
    <details id="lifeAccount" class="life-account haedo-account" data-private hidden>
      <summary id="lifeAccountToggle" class="haedo-icon-button" aria-label="계정 메뉴">
        <span data-haedo-icon="user" aria-hidden="true"></span>
      </summary>
      <div class="life-account-panel haedo-account-panel">
        <span id="lifeAccountLabel"></span>
        <button id="lifeLogout" class="life-button" type="button">로그아웃</button>
      </div>
    </details>
  </div>
  <noscript>생활 자료를 열려면 브라우저에서 JavaScript를 허용해주세요. 기존 기록은 변경되지 않습니다.</noscript>
  <div id="lifeStartup" role="status" aria-live="polite">자료 모아보기를 여는 중입니다.</div>
  <div id="lifeApp" data-private hidden aria-label="자료 모아보기"></div>
  <script src="vendor/idb/idb.js"></script>
  <script src="vendor/supabase/supabase.js"></script>
  <script src="assets/platform-config.js"></script>

  <script src="assets/data.js"></script>
  <script src="assets/platform-data.js"></script>
  <script src="assets/life/core.js"></script>
  <script src="assets/life/workbench.js"></script>
  <script src="assets/life/storage.js"></script>
  <script src="assets/life/remote.js"></script>
  <script src="assets/platform-life-remote.js"></script>
  <script src="assets/life/sync.js"></script>
  <script src="assets/life/legacy.js"></script>
  <script src="assets/life/icons.js"></script>
  <script src="assets/haedo-navigation.js"></script>
  <script src="assets/life/workbench-ui.js"></script>
  <script src="assets/life/ui.js"></script>
  <script src="assets/life/shell.js"></script>

</html>
