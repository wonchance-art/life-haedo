name: Analysis lenses prototype
on:
  pull_request:
    paths:
      - 'docs/prototypes/analysis-lenses/**'
      - 'tests/analysis-lenses*'
      - 'assets/life/ui.css'
      - 'assets/life/icons.js'
      - '.github/workflows/analysis-lenses.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser-ci/package-lock.json
      - run: npm ci --prefix tests/browser-ci --ignore-scripts
      - name: Install pinned Chromium and Korean fonts
        run: |
          node tests/browser-ci/node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check evidence contract and prototype syntax
        run: |
          node --test tests/analysis-lenses.test.cjs
          node --check docs/prototypes/analysis-lenses/app.js
      - name: Verify isolated browser journey
        run: |
          python3 scripts/dev-server.py --port 4188 > /tmp/haedo-prototype-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4188/docs/prototypes/analysis-lenses/', timeout=1)
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise SystemExit('Prototype server did not start')
          PY
          export CHROMIUM_PATH="$(node -p "require('./tests/browser-ci/node_modules/playwright').chromium.executablePath()")"
          node tests/analysis-lenses-browser.cjs
      - name: Preserve anonymous evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analysis-lenses-evidence
          path: .local/analysis-lenses
          if-no-files-found: ignore
