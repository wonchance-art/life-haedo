name: Deploy platform
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm run check
      - run: npm test
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: "true"
      BASE_URL: http://127.0.0.1:4184
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser-ci/package-lock.json
      - name: Install pinned browser tooling
        run: npm ci --prefix tests/browser-ci --ignore-scripts
      - name: Install Chromium and Korean fonts
        run: |
          node tests/browser-ci/node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: Select the pinned browser
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const modulePath = path.resolve('tests/browser-ci/node_modules/playwright');
          const browserPath = require(modulePath).chromium.executablePath();
          if (!fs.existsSync(browserPath)) throw new Error('Pinned Chromium was not installed.');
          fs.appendFileSync(process.env.GITHUB_ENV, `PW_MODULE_PATH=${modulePath}\nCHROMIUM_PATH=${browserPath}\n`);
          NODE
      - name: Start the OAuth-safe local server
        id: server
        run: |
          mkdir -p .local/browser-ci
          python3 scripts/dev-server.py --port 4184 > .local/browser-ci/server.log 2>&1 &
          echo "HAEDO_CI_SERVER_PID=$!" >> "$GITHUB_ENV"
          python3 <<'PY'
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 20
          while True:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4184/index.html', timeout=1) as response:
                      if response.status == 200 and b'id="lifeApp"' in response.read():
                          break
              except (OSError, urllib.error.URLError):
                  pass
              if time.monotonic() >= deadline:
                  raise SystemExit('The local app shell did not become ready.')
              time.sleep(0.2)
          PY
      - name: Verify unified entry and account boundaries
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/unified-home-browser.cjs
      - name: Verify the core experience across screen sizes
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/core-experience-browser.cjs
      - name: Verify composition transactions and recovery
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/composition-storage-browser.cjs
      - name: Verify composition continuity across browser contexts
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/composition-sync-browser.cjs
      - name: Verify selected writing draft transactions
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/writing-sync-storage-browser.cjs
      - name: Verify selected writing drafts across browser contexts
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/writing-sync-browser.cjs
      - name: Verify writing input survives delayed draft notifications
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/writing-sync-incoming-browser.cjs
      - name: Verify reading selection and return context
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/reading-quality-browser.cjs
      - name: Verify reading and writing quality across screen sizes
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/reading-writing-quality-browser.cjs
      - name: Verify local reading position transactions
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/reading-position-storage-browser.cjs
      - name: Verify explicit reading resume and failure recovery
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/reading-resume-browser.cjs
      - name: Verify import outcomes and review selection
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/import-flow-quality-browser.cjs
      - name: Verify social source input and draft recovery
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/life-social-import-browser.cjs
      - name: Verify source reimport identity and immutable versions
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/source-reimport-browser.cjs
      - name: Verify page ordering and preview return
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/page-flow-quality-browser.cjs
      - name: Verify private page expression and preservation boundaries
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/page-expression-browser.cjs
      - name: Verify explicit publication and revocation
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/life-share-browser.cjs
      - name: Verify public expression and anonymous reading boundaries
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/public-expression-browser.cjs
      - name: Verify import-to-page product flow
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/product-flow-quality-browser.cjs
      - name: Verify Korean search and bounded result rendering
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/search-quality-browser.cjs
      - name: Verify private reflection reading and manuscript boundaries
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/reflection-reading-browser.cjs
      - name: Verify book projects, chapter manuscripts and recovery
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-projects-browser.cjs
      - name: Verify private interpretations, evidence and exclusion boundaries
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-insights-browser.cjs
      - name: Verify book reading, editing return and manuscript parity
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-preview-browser.cjs
      - name: Verify manuscript page position and visible chapter editing
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-manuscript-layout-browser.cjs
      - name: Verify immediate chapter editing with default motion
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: BOOK_MANUSCRIPT_LAYOUT_MOTION=no-preference node tests/book-manuscript-layout-browser.cjs
      - name: Verify book editions, archive recovery and backup boundaries
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-history-browser.cjs
      - name: Verify Korean PDF and private native print boundaries
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-print-browser.cjs
      - name: Verify imported records through a four-chapter book and PDF
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-workshop-browser.cjs
      - name: Verify workshop save retries and stale reload protection
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-workshop-recovery-browser.cjs
      - name: Verify reader book layout, output choices and PDF
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-edition-browser.cjs
      - name: Verify saved book re-entry and chapter navigation
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-completion-browser.cjs
      - name: Verify chapter-scoped imports and explicit source linking
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-import-browser.cjs
      - name: Verify chapter import receipts and recovery boundaries
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-import-recovery-browser.cjs
      - name: Verify restored book entry and committed-copy recovery
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/book-restore-entry-browser.cjs
      - name: Verify home navigation, draft re-entry and responsive states
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/home-entry-browser.cjs
      - name: Verify subview location and safe contextual return
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/subview-navigation-browser.cjs
      - name: Verify management storage scope and backup recovery
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: |
          node tests/management-clarity-browser.cjs
          node tests/life-management-browser.cjs
      - name: Verify isolated expression-page design samples
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/expression-design-browser.cjs
      - name: Stop the local server
        if: always()
        run: |
          if [[ -n "${HAEDO_CI_SERVER_PID:-}" ]]; then
            kill "$HAEDO_CI_SERVER_PID" || true
          fi
      - name: Retain anonymous browser reports and failure screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-checks-${{ github.run_attempt }}
          path: |
            .local/core-experience/
            .local/unified-home/
            .local/home-entry/
            .local/subview-navigation/
            .local/management-clarity/
            .local/life-management/
            .local/quality-audit/after/
            .local/composition-sync/
            .local/writing-sync/
            .local/reading-quality/
            .local/reading-writing-quality/
            .local/book-design-reset-app/caret/
            .local/reading-resume/
            .local/product-flow-quality/
            .local/search-quality/
            .local/expression-design/
            .local/page-expression/
            .local/public-expression/
            .local/source-reimport/
            .local/reflection-reading/
            .local/book-projects/
            .local/book-insights/
            .local/book-preview/
            .local/book-history/
            .local/book-print/
            .local/book-workshop/
            .local/book-workshop-recovery/
            .local/book-edition/
            .local/book-completion/after/
            .local/book-import/after/
            .local/book-import-recovery/
            .local/book-restore-entry/after/
            .local/life-social-import/
            .local/share/
            .local/browser-ci/server.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  build:
    if: github.event_name != 'pull_request'
    needs: [check, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Prepare public shell
        env:
          HAEDO_SUPABASE_URL: ${{ secrets.HAEDO_SUPABASE_URL }}
          HAEDO_SUPABASE_KEY: ${{ secrets.HAEDO_SUPABASE_KEY }}
        run: node scripts/prepare-site.mjs .local/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .local/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
