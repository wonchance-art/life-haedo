name: Deploy platform
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # UTC 06:15 / Asia-Seoul 15:15. GitHub may delay or skip scheduled runs.
    - cron: '15 6 * * *'
permissions:
  contents: read
concurrency:
  # PR verification must not queue behind unrelated reviews or live deployments.
  # Main/manual deployments retain their shared, non-cancelling group.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm run check
      - run: npm test
  browser_suites:
    runs-on: ubuntu-24.04
    # Keep every existing suite, but give five independent fixture groups their
    # own server/browser so a long serial job cannot omit the final checks.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: "true"
      BASE_URL: http://127.0.0.1:4184
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser-ci/package-lock.json
      - name: Install pinned browser tooling
        run: npm ci --prefix tests/browser-ci --ignore-scripts
      - name: Install Chromium and Korean fonts
        run: |
          node tests/browser-ci/node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: Select the pinned browser
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const modulePath = path.resolve('tests/browser-ci/node_modules/playwright');
          const browserPath = require(modulePath).chromium.executablePath();
          if (!fs.existsSync(browserPath)) throw new Error('Pinned Chromium was not installed.');
          fs.appendFileSync(process.env.GITHUB_ENV, `PW_MODULE_PATH=${modulePath}\nCHROMIUM_PATH=${browserPath}\n`);
          NODE
      - name: Start the OAuth-safe local server
        id: server
        run: |
          mkdir -p .local/browser-ci
          python3 scripts/dev-server.py --port 4184 > .local/browser-ci/server.log 2>&1 &
          echo "HAEDO_CI_SERVER_PID=$!" >> "$GITHUB_ENV"
          python3 <<'PY'
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 20
          while True:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4184/index.html', timeout=1) as response:
                      if response.status == 200 and b'id="lifeApp"' in response.read():
                          break
              except (OSError, urllib.error.URLError):
                  pass
              if time.monotonic() >= deadline:
                  raise SystemExit('The local app shell did not become ready.')
              time.sleep(0.2)
          PY
      - name: Verify unified entry and account boundaries
        if: ${{ matrix.group == 1 && !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/unified-home-browser.cjs
      - name: Verify news navigation, saved lists and language preferences
        if: ${{ matrix.group == 1 && !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/life-news-browser.cjs
      - name: Verify the core experience across screen sizes
