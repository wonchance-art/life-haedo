            .local/timeline-recovery/after/
            .local/home-entry/
            .local/preservation/
            .local/nine-board-image/
            .local/nine-board-compose/
            .local/original-attachments/
            .local/original-attachments-integrated/
            .local/obsidian-update/
            .local/photo-post-evidence/
            .local/subview-navigation/
            .local/management-clarity/
            .local/life-management/
            .local/quality-audit/after/
            .local/composition-sync/
            .local/writing-sync/
            .local/reading-quality/
            .local/reading-writing-quality/
            .local/book-design-reset-app/caret/
            .local/reading-resume/
            .local/product-flow-quality/
            .local/search-quality/
            .local/expression-design/
            .local/page-expression/
            .local/public-expression/
            .local/source-reimport/
            .local/reflection-reading/
            .local/reflection-to-outline/interaction/
            .local/reflection-lenses/
            .local/book-projects/
            .local/book-insights/
            .local/book-preview/
            .local/book-history/
            .local/book-print/
            .local/book-workshop/
            .local/book-workshop-recovery/
            .local/book-edition/
            .local/book-completion/after/
            .local/book-import/after/
            .local/book-import-recovery/
            .local/book-restore-entry/after/
            .local/life-social-import/
            .local/share/
            .local/browser-ci/server.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  browser:
    # Preserve the existing required-check name while all four suites must pass.
    needs: browser_suites
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require every browser suite group
        env:
          HAEDO_BROWSER_RESULT: ${{ needs.browser_suites.result }}
        run: test "$HAEDO_BROWSER_RESULT" = success
  blog:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: "true"
      BASE_URL: http://127.0.0.1:4184
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser-ci/package-lock.json
      - name: Install pinned browser tooling
        run: npm ci --prefix tests/browser-ci --ignore-scripts
      - name: Install Chromium and Korean fonts
        run: |
          node tests/browser-ci/node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: Select the pinned browser
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const modulePath = path.resolve('tests/browser-ci/node_modules/playwright');
          const browserPath = require(modulePath).chromium.executablePath();
          if (!fs.existsSync(browserPath)) throw new Error('Pinned Chromium was not installed.');
          fs.appendFileSync(process.env.GITHUB_ENV, `PW_MODULE_PATH=${modulePath}\nCHROMIUM_PATH=${browserPath}\n`);
          NODE
      - name: Start the OAuth-safe local server
        id: server
        run: |
          mkdir -p .local/browser-ci
          python3 scripts/dev-server.py --port 4184 > .local/browser-ci/server.log 2>&1 &
          echo "HAEDO_CI_SERVER_PID=$!" >> "$GITHUB_ENV"
          python3 <<'PY'
          import time
          import urllib.error
          import urllib.request

          deadline = time.monotonic() + 20
          while True:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:4184/index.html', timeout=1) as response:
                      if response.status == 200 and b'id="lifeApp"' in response.read():
                          break
              except (OSError, urllib.error.URLError):
                  pass
              if time.monotonic() >= deadline:
                  raise SystemExit('The local app shell did not become ready.')
              time.sleep(0.2)
          PY
      - name: Verify isolated SQL, RLS, simultaneous CAS and original media handler
        id: backend
        run: node scripts/check-blog-backend.mjs --keep
      - name: Select the isolated QA database
        if: steps.backend.outcome == 'success'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('.local/blog-backend/report.json', 'utf8'));
          if (!report.pass || !/^haedo-blog-postgres-[0-9]+$/.test(report.container)) throw new Error('Invalid local fixture');
          fs.appendFileSync(process.env.GITHUB_ENV, `BLOG_POSTGRES_CONTAINER=${report.container}\nBLOG_POSTGRES_DATABASE=haedo_blog_qa_ci\n`);
          NODE
      - name: Verify real SQL and browser publication journeys
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: node tests/blog-completion-browser.cjs --prepare-database
      - name: Verify additive installation rollback and preservation of existing records
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: node tests/integrated-release-installation.cjs
      - name: Verify series publication receipts, independent wrappers and current revocation
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: node tests/blog-series-backend.cjs
      - name: Verify explicit series publication and anonymous native reading
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: node tests/blog-series-public-browser.cjs
      - name: Verify isolated nine-slot publication, receipts and independent revocation
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: node tests/nine-public-backend.cjs
      - name: Verify selected private areas through explicit publication and anonymous reading
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: node tests/nine-public-browser.cjs
      - name: Verify materials through finished writing, selective publication and exact file restoration
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: BLOG_POSTGRES_DATABASE="${BLOG_POSTGRES_DATABASE}_material" node tests/material-writing-browser.cjs --prepare-database
      - name: Verify preparation continuity, shared output claims and exact finished post restoration
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: BLOG_POSTGRES_DATABASE="${BLOG_POSTGRES_DATABASE}_material_continuity" node tests/material-continuity-browser.cjs --prepare-database
      - name: Verify preparation ownership, durable receipts and concurrent claims in PostgreSQL
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: BLOG_POSTGRES_DATABASE="${BLOG_POSTGRES_DATABASE}_material_contract" node tests/material-continuity-backend.cjs --prepare-database
      - name: Verify explicit preparation continuity across screen sizes and protected input
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: BLOG_POSTGRES_DATABASE="${BLOG_POSTGRES_DATABASE}_material_continuity_visual" node tests/material-continuity-visual-browser.cjs --prepare-database
      - name: Verify selected public cover publication, current targets and exact reading return
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: node tests/public-cover-browser.cjs --prepare-database
      - name: Verify public cover preview, protected input and anonymous reading across screen sizes
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: node tests/public-cover-visual-browser.cjs --prepare-database
      - name: Verify one complete preparation, original-photo writing, publication and preservation journey
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        run: BLOG_POSTGRES_DATABASE="${BLOG_POSTGRES_DATABASE}_integrated" node tests/integrated-release-browser.cjs --prepare-database
      - name: Verify private post manager and exact provenance return
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/blog-manager-browser.cjs
      - name: Verify anonymous original-photo reading
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/blog-public-browser.cjs
      - name: Verify exact quotes, nine-area selections and storage failure recovery
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/nine-board-evidence-browser.cjs
      - name: Verify isolated source opening and exact search return
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/search-source-isolation-browser.cjs
      - name: Verify generated configuration and complete installed shell hashes
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        env:
          PREVIOUS_RELEASE: "9440f12e008a5e9285be69cf06655967a9defeed"
        run: node scripts/verify-prepared-site.mjs
      - name: Verify the actual previous service worker updates without losing originals
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        run: node tests/blog-release-browser.cjs
      - name: Stop this job's isolated fixture and local server
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs'), { execFileSync } = require('node:child_process');
          if (fs.existsSync('.local/blog-backend/report.json')) {
            const report = JSON.parse(fs.readFileSync('.local/blog-backend/report.json', 'utf8'));
            if (!/^haedo-blog-postgres-[0-9]+$/.test(report.container)) throw new Error('Invalid local fixture');
            execFileSync('docker', ['rm', '--force', '--volumes', report.container], { stdio: 'inherit' });
          }
          NODE
          if [[ -n "${HAEDO_CI_SERVER_PID:-}" ]]; then
            kill "$HAEDO_CI_SERVER_PID" || true
          fi
      - name: Retain anonymous blog evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blog-checks-${{ github.run_attempt }}
          path: |
            .local/integrated-release-installation/
            .local/integrated-release/
            .local/blog-backend/
            .local/blog-completion/
            .local/blog-series-backend/
            .local/blog-series-public/
            .local/nine-public-backend/
            .local/nine-public/
            .local/material-writing/
            .local/material-continuity/
            .local/material-continuity-visual/
            .local/blog-manager/
            .local/blog-public/
            .local/preservation/
            .local/source-evidence/
            .local/search-source-isolation/
            .local/prepared-site-check/platform-report.txt
            .local/prepared-site-check/baseline.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  build:
    if: ${{ github.event_name != 'pull_request' && github.repository == 'wonchance-art/life-haedo' && github.ref == 'refs/heads/main' }}
    needs: [check, browser, blog]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Refresh reviewed public feed from the previous publication
        run: node scripts/refresh-discovery-artifact.cjs collect
      - name: Prepare public shell
        env:
          HAEDO_SUPABASE_URL: ${{ secrets.HAEDO_SUPABASE_URL }}
          HAEDO_SUPABASE_KEY: ${{ secrets.HAEDO_SUPABASE_KEY }}
        run: node scripts/prepare-site.mjs .local/site
      - name: Install and verify the collected public catalog
        run: node scripts/refresh-discovery-artifact.cjs install
      - name: Retain public collection receipts without publishing them in the site
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-feed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/discovery-ci/outcome.json
            .local/discovery-ci/collector-report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .local/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
