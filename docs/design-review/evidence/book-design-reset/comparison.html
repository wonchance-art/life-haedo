window.BookSample = {"book": {"id": "e917384f-7123-4145-bf0c-c4c868eab804", "title": "일과 쉼 사이에서 오래 좋아할 기준을 찾아서 — 네 번의 선택을 다시 읽는 기록", "fromYear": "2016", "toYear": "2025", "question": "나는 무엇을 잘하는 사람보다 무엇을 오래 좋아하는 사람이 되고 싶었을까?", "chapters": [{"id": "9242dd4e-ab19-42fa-9eda-0aa5302878ae", "title": "잘하고 싶었던 마음", "note": "처음 면접을 보러 가던 아침에는 평소보다 일찍 집을 나섰다. 역 앞에서 커피를 사면서 회사 이름이 적힌 안내 문자를 몇 번이나 다시 읽었다. 무엇을 하게 될지보다 그 이름을 다른 사람에게 어떻게 말할지 먼저 생각했다는 사실은 한참 뒤에야 알아차렸다.\n\n그날의 메모에는 질문과 답변보다 면접관의 표정이 더 자세히 남아 있다. 고개를 끄덕였다는 것, 다음 질문으로 빨리 넘어갔다는 것, 마지막에 수고했다고 말했다는 것을 하나씩 적었다. 내가 하고 싶은 일은 한 줄이었고, 나를 어떻게 보았을지에 대한 추측은 한 쪽을 채웠다.\n\n돌아오는 전철에서 친구에게 잘 본 것 같다고 말했다. 잘 보았다는 말의 기준을 물었다면 대답하기 어려웠을 것이다. 준비한 문장을 빠뜨리지 않았고 분위기가 나쁘지 않았다는 뜻이었다. 실제로 내가 질문해야 했던 근무 방식이나 동료의 역할은 거의 묻지 못했다.\n\n당시에는 선택할 수 있는 기회가 많지 않다고 느꼈다. 그래서 먼저 평가받고, 합격한 뒤에 내게 맞는지 생각해도 늦지 않다고 여겼다. 지금 읽는 사람에게 그 판단이 틀렸다고 말하고 싶지는 않다. 그때의 정보와 걱정 속에서는 꽤 현실적인 순서였기 때문이다.\n\n며칠 뒤 연락을 기다리며 적은 글에는 다른 장면이 나온다. 예전에 짧게 도왔던 작은 가게에서 하루의 일을 함께 정리하던 시간이다. 그곳에서는 내가 질문하면 누군가 실제 일을 보여 주었다. 실수한 이유를 설명할 수 있었고 다음번에는 무엇을 바꿀지도 함께 정했다.\n\n나는 그 기억을 면접에 관한 글과 따로 보관해 두었다. 하나는 중요한 진로 기록이고 다른 하나는 지나간 아르바이트 이야기라고 생각했다. 이번에 두 글을 나란히 놓으니 회사의 크기와 무관하게 내가 반복해서 찾은 조건이 있었다. 질문할 수 있는 사람과 다음 날 다시 시도할 시간이 필요했다.\n\n이 연결이 당시의 진짜 속마음을 모두 밝혀 주는 것은 아니다. 생활비를 벌어야 한다는 압박과 새로운 동네로 옮겨 보고 싶은 마음도 있었다. 기억에 잘 남지 않는 이유를 지우고 하나의 성장 이야기로 정리하면 문장은 매끈해질지 몰라도 실제 선택과는 멀어진다.\n\n그래서 이 장을 쓰면서 먼저 남긴 것은 결론이 아니라 장면의 순서다. 안내 문자를 읽던 아침, 질문하지 못하고 나온 면접실, 가게 마감을 도우며 다음 일을 물었던 저녁을 차례로 놓았다. 각 장면에서 내가 알고 있었던 것과 아직 몰랐던 것을 구분해 적었다.\n\n첫 직장에서 배운 일 중에는 지금도 계속하는 습관이 있다. 막힌 부분을 혼자 오래 붙잡기 전에 이미 해 본 사람에게 상황을 설명하는 일이다. 설명하다 보면 질문 자체가 바뀌기도 한다. 도움을 구하는 것이 능력 부족의 증거라는 생각을 천천히 내려놓게 되었다.\n\n물론 평가를 의식하지 않게 된 것은 아니다. 새로운 일을 시작할 때면 아직도 준비한 말을 잘 전달했는지 먼저 돌아본다. 다만 그다음에 한 가지 질문을 더 하게 됐다. 이곳에서 매일 반복할 시간은 어떤 모습이며, 나는 그 시간을 오래 견디는 것을 넘어 좋아할 수 있을까.\n\n다른 사람의 글에는 직업과 좋아하는 일을 분리한 이야기가 있었다. 생활을 지탱하는 일을 안정적으로 이어 가면서 취미에 기대를 모두 걸지 않았다는 설명이었다. 내 경험과 다르지만 그 선택을 반례로 남겨 두고 싶다. 좋아하는 일을 직업으로 만드는 것만이 유일한 답은 아니다.\n\n이 장에서 말하는 기준은 완성된 목록이 아니다. 어떤 때에는 수입이, 어떤 때에는 함께 배우는 관계가 더 중요했다. 달라진 우선순위를 일관성 부족으로 취급하는 대신 그때 감당할 수 있었던 조건을 기록해 보려 한다. 기준도 생활의 변화 속에서 다시 쓰일 수 있다.\n\n옛 글의 한 문장을 고치고 싶은 날도 있었다. 너무 단순하게 적었다는 생각이 들었기 때문이다. 그러나 원문은 그대로 두고 지금의 설명을 옆에 남기기로 했다. 과거의 문장을 오늘의 언어로 덮으면 내가 무엇을 새로 알게 되었는지 비교할 자리가 사라진다.\n\n마지막으로 면접을 마치고 집 앞 골목을 걷던 기억을 붙였다. 합격 여부를 아직 몰랐지만 그날 해야 할 일을 마쳤다는 안도감이 있었다. 미래를 정확히 예측하지 못한 자신을 탓하기보다 다음 질문을 남기는 것으로 이 장을 끝낸다. 내가 오래 좋아할 하루의 조건은 무엇일까.", "versionIds": ["6165c059-c8db-4a6c-adc4-ef8727ec6f53"], "insights": [{"id": "9139d7b0-a551-4528-961a-0e1bd8ab434a", "statement": "지금은 잘하는 사람으로 보이는 일과 오래 좋아할 조건을 구분해 보려 한다.", "uncertainty": "그때 말하지 않았던 사정이 있었을 수 있다. 남은 글만으로 모든 선택을 설명하지 않는다.", "supportVersionIds": ["6165c059-c8db-4a6c-adc4-ef8727ec6f53"], "counterVersionIds": ["36a18637-0e3b-46f6-a275-9fe838d5e173", "d1d74dd0-55e3-4c7a-a090-76dd0633b1c4"], "excluded": false}, {"id": "a0768ed1-ff44-466a-b267-299b9661f0e7", "statement": "보류한 해석은 이번 독자용 책자에 내보내지 않는다.", "uncertainty": "", "supportVersionIds": [], "counterVersionIds": ["ee8c197e-32bb-44f7-b7ce-88dbdf26a411"], "excluded": true}]}, {"id": "088c0a3a-e283-4aeb-a4fe-1656a47cd5fb", "title": "쉬는 동안 생긴 기준", "note": "일을 잠시 멈춘 첫 주에는 달력이 유난히 넓어 보였다. 약속이 없는 오후를 자유라고 부르다가도 저녁이 되면 무엇을 했는지 설명해야 할 것 같았다. 메모를 열어 보니 쉬는 날에도 일을 했던 날과 같은 방식으로 자신을 채점하고 있었다.\n\n처음 바꾼 일은 거창한 계획이 아니었다. 일어나면 커튼을 열고 점심 한 끼를 직접 만드는 순서를 정했다. 오전에 실패하면 하루 전체를 포기하는 대신 오후에 할 수 있는 작은 일을 골랐다. 이 순서는 성과를 늘리기보다 다시 시작할 자리를 만드는 데 도움이 됐다.\n\n가까운 공원을 걷던 날에는 나무 이름을 몰라도 멈춰 볼 수 있었다. 사진을 남기지 않은 길의 모양을 집에 돌아와 적었다. 기록을 잘 남기기 위해 경험하는 것이 아니라 지나간 경험을 다시 알아차리려고 기록한다는 감각이 조금 생겼다.\n\n다른 사람에게 이 시간을 설명하는 일은 여전히 어려웠다. 쉬고 있다고 말한 뒤 괜히 배우는 것과 준비하는 일을 덧붙이곤 했다. 지금 그 말을 읽으며 당시의 불안을 이해하려 한다. 쉬는 시간에도 쓸모를 증명해야 한다고 느꼈던 마음이 있었다.\n\n누구에게나 같은 휴식이 가능하다고 말할 수는 없다. 돈과 건강, 돌볼 사람의 유무에 따라 멈출 수 있는 시간은 다르다. 내 경험을 보편적인 방법으로 만들기보다 내가 도움을 받았던 조건을 함께 적어 두는 편이 정확하다.\n\n이 시기의 끝에서 남은 것은 빈 달력을 채우는 기술이 아니었다. 약속을 지키지 못한 날에도 다음 하루를 시작할 수 있다는 경험이었다. 쉬는 동안 세운 기준은 이후 다시 일할 때에도 작은 복귀 지점이 되어 주었다.\n\n나중에 다시 읽고 고친 문장: 쉬는 시간을 설명할 말이 없던 날도 그 시기의 일부로 남긴다.", "versionIds": ["5184faed-d93a-4b6f-a220-357a94b9148e"]}, {"id": "cef4ea73-1d87-48c4-98d5-910705913efc", "title": "함께 배우는 쪽으로", "note": "책 모임에 처음 나가던 날에는 밑줄 친 문장을 많이 준비했다. 제대로 읽었다는 것을 보여 주고 싶어서였다. 그런데 모임에서 오래 남은 이야기는 정리된 의견보다 이해하지 못한 부분을 묻는 질문이었다.\n\n한 사람은 인물의 선택이 납득되지 않는다고 말했다. 다른 사람은 비슷한 상황에서 자신이 했던 일을 조심스럽게 꺼냈다. 정답을 고르는 대화였다면 지나쳤을 장면이 서로 다른 경험 덕분에 조금 넓어졌다.\n\n집에 돌아와 메모의 제목을 바꿨다. 책의 핵심을 정리한 글에서 다음에 물어볼 질문으로 바꾼 것이다. 이미 알고 있는 것을 증명하려는 마음과 새로 알아보고 싶은 마음은 비슷해 보여도 대화를 다른 방향으로 이끈다.\n\n모른다고 말하기 쉬운 관계가 저절로 만들어지지는 않았다. 질문을 재촉하지 않는 시간과 말하지 않아도 괜찮다는 약속이 필요했다. 그 조건을 사람의 성격으로만 설명하지 않고 모임을 운영하는 방식으로도 기억해 두려 한다.\n\n이 장에 연결한 모임 안내는 링크만 보관돼 있다. 실제 프로그램의 세부 내용까지 읽었다고 쓰지 않는다. 확보한 자료와 아직 확인하지 않은 부분을 구분하는 태도는 책을 읽을 때뿐 아니라 나의 경험을 설명할 때도 필요하다.\n\n잘 아는 사람이 되고 싶었던 마음은 사라지지 않았다. 다만 혼자 완성한 답을 가져가는 것만이 준비는 아니라는 것을 배웠다. 다음 사람의 질문을 들을 여백을 남기는 것도 함께 배우기 위한 준비였다.", "versionIds": ["04e9cd64-5d4d-44d1-8034-448e57da8a89", "36a18637-0e3b-46f6-a275-9fe838d5e173"]}, {"id": "017051e9-c031-4b79-8416-40e33283ec78", "title": "오래 좋아하는 것을 고르기", "note": "좋아하는 산책길을 물으면 한동안 사진이 잘 나오는 장소를 먼저 말했다. 실제로 자주 걷는 길은 특별한 풍경이 없는 동네 길이었다. 어느 쪽이 진짜 취향인지 고르려 하기보다 두 길에서 기대하는 것이 다르다는 사실을 적어 보았다.\n\n같은 나무를 계절마다 찾아가며 사진을 한 장씩 남겼다🌱 잎의 색이 크게 바뀌지 않은 날에도 빛의 방향과 그림자의 길이가 달랐다. 변화가 작다는 이유로 기록하지 않았더라면 보지 못했을 차이였다.\n\n화면에 올릴 사진을 고르는 시간과 그날을 기억하는 시간이 꼭 같지는 않았다. 잘 나온 한 장에서는 길을 잘못 들어 돌아왔던 경험이 빠졌다. 공개할 글을 편집하더라도 개인 기록에는 그 우회로를 남겨 두고 싶었다.\n\n예전에는 취향이 일관되어야 자신을 잘 설명할 수 있다고 생각했다. 지금은 오래 좋아한 것과 새로 궁금해진 것이 함께 있어도 괜찮다고 느낀다. 달라진 관심을 곧바로 정체성의 변화로 선언하지 않고 조금 더 경험할 시간을 주기로 했다.\n\n여기까지의 글은 네 번의 선택을 한 방향의 성장으로 묶으려는 시도가 아니다. 잘하고 싶은 마음, 쉬고 싶은 마음, 배우고 싶은 마음과 보여 주고 싶은 마음은 지금도 함께 있다. 어느 하나를 없애기보다 각각이 언제 앞에 나오는지 알아차리려 한다.\n\n책의 마지막에는 다음 산책에서 확인할 질문을 남긴다. 남에게 설명하기 좋은 선택과 내가 다시 돌아가고 싶은 선택 사이의 거리는 얼마나 될까. 답을 서둘러 정하지 않고 다음에 쓴 글과 나란히 읽을 수 있도록 오늘의 문장을 보관한다.", "versionIds": ["61bb7fc8-8208-4960-9984-0dc8caef1723"]}], "editions": [{"id": "707a4d12-69e5-480c-bf13-edf946fa35d6", "label": "독자용 책자로 다듬기 전 네 장 원고", "createdAt": "2026-10-08T06:17:39.170Z", "title": "일과 쉼 사이에서 오래 좋아할 기준을 찾아서 — 네 번의 선택을 다시 읽는 기록", "fromYear": "2016", "toYear": "2025", "question": "나는 무엇을 잘하는 사람보다 무엇을 오래 좋아하는 사람이 되고 싶었을까?", "chapters": [{"id": "422fbed0-294a-43a0-8b68-1e2d82fdcc8c", "title": "잘하고 싶었던 마음", "note": "처음 면접을 보러 가던 아침에는 평소보다 일찍 집을 나섰다. 역 앞에서 커피를 사면서 회사 이름이 적힌 안내 문자를 몇 번이나 다시 읽었다. 무엇을 하게 될지보다 그 이름을 다른 사람에게 어떻게 말할지 먼저 생각했다는 사실은 한참 뒤에야 알아차렸다.\n\n그날의 메모에는 질문과 답변보다 면접관의 표정이 더 자세히 남아 있다. 고개를 끄덕였다는 것, 다음 질문으로 빨리 넘어갔다는 것, 마지막에 수고했다고 말했다는 것을 하나씩 적었다. 내가 하고 싶은 일은 한 줄이었고, 나를 어떻게 보았을지에 대한 추측은 한 쪽을 채웠다.\n\n돌아오는 전철에서 친구에게 잘 본 것 같다고 말했다. 잘 보았다는 말의 기준을 물었다면 대답하기 어려웠을 것이다. 준비한 문장을 빠뜨리지 않았고 분위기가 나쁘지 않았다는 뜻이었다. 실제로 내가 질문해야 했던 근무 방식이나 동료의 역할은 거의 묻지 못했다.\n\n당시에는 선택할 수 있는 기회가 많지 않다고 느꼈다. 그래서 먼저 평가받고, 합격한 뒤에 내게 맞는지 생각해도 늦지 않다고 여겼다. 지금 읽는 사람에게 그 판단이 틀렸다고 말하고 싶지는 않다. 그때의 정보와 걱정 속에서는 꽤 현실적인 순서였기 때문이다.\n\n며칠 뒤 연락을 기다리며 적은 글에는 다른 장면이 나온다. 예전에 짧게 도왔던 작은 가게에서 하루의 일을 함께 정리하던 시간이다. 그곳에서는 내가 질문하면 누군가 실제 일을 보여 주었다. 실수한 이유를 설명할 수 있었고 다음번에는 무엇을 바꿀지도 함께 정했다.\n\n나는 그 기억을 면접에 관한 글과 따로 보관해 두었다. 하나는 중요한 진로 기록이고 다른 하나는 지나간 아르바이트 이야기라고 생각했다. 이번에 두 글을 나란히 놓으니 회사의 크기와 무관하게 내가 반복해서 찾은 조건이 있었다. 질문할 수 있는 사람과 다음 날 다시 시도할 시간이 필요했다.\n\n이 연결이 당시의 진짜 속마음을 모두 밝혀 주는 것은 아니다. 생활비를 벌어야 한다는 압박과 새로운 동네로 옮겨 보고 싶은 마음도 있었다. 기억에 잘 남지 않는 이유를 지우고 하나의 성장 이야기로 정리하면 문장은 매끈해질지 몰라도 실제 선택과는 멀어진다.\n\n그래서 이 장을 쓰면서 먼저 남긴 것은 결론이 아니라 장면의 순서다. 안내 문자를 읽던 아침, 질문하지 못하고 나온 면접실, 가게 마감을 도우며 다음 일을 물었던 저녁을 차례로 놓았다. 각 장면에서 내가 알고 있었던 것과 아직 몰랐던 것을 구분해 적었다.\n\n첫 직장에서 배운 일 중에는 지금도 계속하는 습관이 있다. 막힌 부분을 혼자 오래 붙잡기 전에 이미 해 본 사람에게 상황을 설명하는 일이다. 설명하다 보면 질문 자체가 바뀌기도 한다. 도움을 구하는 것이 능력 부족의 증거라는 생각을 천천히 내려놓게 되었다.\n\n물론 평가를 의식하지 않게 된 것은 아니다. 새로운 일을 시작할 때면 아직도 준비한 말을 잘 전달했는지 먼저 돌아본다. 다만 그다음에 한 가지 질문을 더 하게 됐다. 이곳에서 매일 반복할 시간은 어떤 모습이며, 나는 그 시간을 오래 견디는 것을 넘어 좋아할 수 있을까.\n\n다른 사람의 글에는 직업과 좋아하는 일을 분리한 이야기가 있었다. 생활을 지탱하는 일을 안정적으로 이어 가면서 취미에 기대를 모두 걸지 않았다는 설명이었다. 내 경험과 다르지만 그 선택을 반례로 남겨 두고 싶다. 좋아하는 일을 직업으로 만드는 것만이 유일한 답은 아니다.\n\n이 장에서 말하는 기준은 완성된 목록이 아니다. 어떤 때에는 수입이, 어떤 때에는 함께 배우는 관계가 더 중요했다. 달라진 우선순위를 일관성 부족으로 취급하는 대신 그때 감당할 수 있었던 조건을 기록해 보려 한다. 기준도 생활의 변화 속에서 다시 쓰일 수 있다.\n\n옛 글의 한 문장을 고치고 싶은 날도 있었다. 너무 단순하게 적었다는 생각이 들었기 때문이다. 그러나 원문은 그대로 두고 지금의 설명을 옆에 남기기로 했다. 과거의 문장을 오늘의 언어로 덮으면 내가 무엇을 새로 알게 되었는지 비교할 자리가 사라진다.\n\n마지막으로 면접을 마치고 집 앞 골목을 걷던 기억을 붙였다. 합격 여부를 아직 몰랐지만 그날 해야 할 일을 마쳤다는 안도감이 있었다. 미래를 정확히 예측하지 못한 자신을 탓하기보다 다음 질문을 남기는 것으로 이 장을 끝낸다. 내가 오래 좋아할 하루의 조건은 무엇일까.", "versionIds": ["6165c059-c8db-4a6c-adc4-ef8727ec6f53"], "insights": [{"id": "1cc6004e-814e-42b6-aedf-3a5d091a5cd8", "statement": "지금은 잘하는 사람으로 보이는 일과 오래 좋아할 조건을 구분해 보려 한다.", "uncertainty": "그때 말하지 않았던 사정이 있었을 수 있다. 남은 글만으로 모든 선택을 설명하지 않는다.", "supportVersionIds": ["6165c059-c8db-4a6c-adc4-ef8727ec6f53"], "counterVersionIds": ["36a18637-0e3b-46f6-a275-9fe838d5e173", "d1d74dd0-55e3-4c7a-a090-76dd0633b1c4"], "excluded": false}, {"id": "0b4e86f9-c7fb-47f7-beb4-c049973a9211", "statement": "보류한 해석은 이번 독자용 책자에 내보내지 않는다.", "uncertainty": "", "supportVersionIds": [], "counterVersionIds": ["ee8c197e-32bb-44f7-b7ce-88dbdf26a411"], "excluded": true}]}, {"id": "7d5b9de6-fe7b-40fc-a79e-68088617ba4b", "title": "쉬는 동안 생긴 기준", "note": "일을 잠시 멈춘 첫 주에는 달력이 유난히 넓어 보였다. 약속이 없는 오후를 자유라고 부르다가도 저녁이 되면 무엇을 했는지 설명해야 할 것 같았다. 메모를 열어 보니 쉬는 날에도 일을 했던 날과 같은 방식으로 자신을 채점하고 있었다.\n\n처음 바꾼 일은 거창한 계획이 아니었다. 일어나면 커튼을 열고 점심 한 끼를 직접 만드는 순서를 정했다. 오전에 실패하면 하루 전체를 포기하는 대신 오후에 할 수 있는 작은 일을 골랐다. 이 순서는 성과를 늘리기보다 다시 시작할 자리를 만드는 데 도움이 됐다.\n\n가까운 공원을 걷던 날에는 나무 이름을 몰라도 멈춰 볼 수 있었다. 사진을 남기지 않은 길의 모양을 집에 돌아와 적었다. 기록을 잘 남기기 위해 경험하는 것이 아니라 지나간 경험을 다시 알아차리려고 기록한다는 감각이 조금 생겼다.\n\n다른 사람에게 이 시간을 설명하는 일은 여전히 어려웠다. 쉬고 있다고 말한 뒤 괜히 배우는 것과 준비하는 일을 덧붙이곤 했다. 지금 그 말을 읽으며 당시의 불안을 이해하려 한다. 쉬는 시간에도 쓸모를 증명해야 한다고 느꼈던 마음이 있었다.\n\n누구에게나 같은 휴식이 가능하다고 말할 수는 없다. 돈과 건강, 돌볼 사람의 유무에 따라 멈출 수 있는 시간은 다르다. 내 경험을 보편적인 방법으로 만들기보다 내가 도움을 받았던 조건을 함께 적어 두는 편이 정확하다.\n\n이 시기의 끝에서 남은 것은 빈 달력을 채우는 기술이 아니었다. 약속을 지키지 못한 날에도 다음 하루를 시작할 수 있다는 경험이었다. 쉬는 동안 세운 기준은 이후 다시 일할 때에도 작은 복귀 지점이 되어 주었다.", "versionIds": ["5184faed-d93a-4b6f-a220-357a94b9148e"]}, {"id": "f9fc4cce-5851-4066-8cc8-637a8fe1b275", "title": "함께 배우는 쪽으로", "note": "책 모임에 처음 나가던 날에는 밑줄 친 문장을 많이 준비했다. 제대로 읽었다는 것을 보여 주고 싶어서였다. 그런데 모임에서 오래 남은 이야기는 정리된 의견보다 이해하지 못한 부분을 묻는 질문이었다.\n\n한 사람은 인물의 선택이 납득되지 않는다고 말했다. 다른 사람은 비슷한 상황에서 자신이 했던 일을 조심스럽게 꺼냈다. 정답을 고르는 대화였다면 지나쳤을 장면이 서로 다른 경험 덕분에 조금 넓어졌다.\n\n집에 돌아와 메모의 제목을 바꿨다. 책의 핵심을 정리한 글에서 다음에 물어볼 질문으로 바꾼 것이다. 이미 알고 있는 것을 증명하려는 마음과 새로 알아보고 싶은 마음은 비슷해 보여도 대화를 다른 방향으로 이끈다.\n\n모른다고 말하기 쉬운 관계가 저절로 만들어지지는 않았다. 질문을 재촉하지 않는 시간과 말하지 않아도 괜찮다는 약속이 필요했다. 그 조건을 사람의 성격으로만 설명하지 않고 모임을 운영하는 방식으로도 기억해 두려 한다.\n\n이 장에 연결한 모임 안내는 링크만 보관돼 있다. 실제 프로그램의 세부 내용까지 읽었다고 쓰지 않는다. 확보한 자료와 아직 확인하지 않은 부분을 구분하는 태도는 책을 읽을 때뿐 아니라 나의 경험을 설명할 때도 필요하다.\n\n잘 아는 사람이 되고 싶었던 마음은 사라지지 않았다. 다만 혼자 완성한 답을 가져가는 것만이 준비는 아니라는 것을 배웠다. 다음 사람의 질문을 들을 여백을 남기는 것도 함께 배우기 위한 준비였다.", "versionIds": ["04e9cd64-5d4d-44d1-8034-448e57da8a89", "36a18637-0e3b-46f6-a275-9fe838d5e173"]}, {"id": "7f986ab7-afb3-49bc-a0c8-c400b6ec5d18", "title": "오래 좋아하는 것을 고르기", "note": "좋아하는 산책길을 물으면 한동안 사진이 잘 나오는 장소를 먼저 말했다. 실제로 자주 걷는 길은 특별한 풍경이 없는 동네 길이었다. 어느 쪽이 진짜 취향인지 고르려 하기보다 두 길에서 기대하는 것이 다르다는 사실을 적어 보았다.\n\n같은 나무를 계절마다 찾아가며 사진을 한 장씩 남겼다🌱 잎의 색이 크게 바뀌지 않은 날에도 빛의 방향과 그림자의 길이가 달랐다. 변화가 작다는 이유로 기록하지 않았더라면 보지 못했을 차이였다.\n\n화면에 올릴 사진을 고르는 시간과 그날을 기억하는 시간이 꼭 같지는 않았다. 잘 나온 한 장에서는 길을 잘못 들어 돌아왔던 경험이 빠졌다. 공개할 글을 편집하더라도 개인 기록에는 그 우회로를 남겨 두고 싶었다.\n\n예전에는 취향이 일관되어야 자신을 잘 설명할 수 있다고 생각했다. 지금은 오래 좋아한 것과 새로 궁금해진 것이 함께 있어도 괜찮다고 느낀다. 달라진 관심을 곧바로 정체성의 변화로 선언하지 않고 조금 더 경험할 시간을 주기로 했다.\n\n여기까지의 글은 네 번의 선택을 한 방향의 성장으로 묶으려는 시도가 아니다. 잘하고 싶은 마음, 쉬고 싶은 마음, 배우고 싶은 마음과 보여 주고 싶은 마음은 지금도 함께 있다. 어느 하나를 없애기보다 각각이 언제 앞에 나오는지 알아차리려 한다.\n\n책의 마지막에는 다음 산책에서 확인할 질문을 남긴다. 남에게 설명하기 좋은 선택과 내가 다시 돌아가고 싶은 선택 사이의 거리는 얼마나 될까. 답을 서둘러 정하지 않고 다음에 쓴 글과 나란히 읽을 수 있도록 오늘의 문장을 보관한다.", "versionIds": ["61bb7fc8-8208-4960-9984-0dc8caef1723"]}]}]}, "sources": [{"id": "4427e3a4-c481-4555-bb24-9e36de6fbbcf", "origin": "naver_blog", "title": "처음 일을 고르며 적어 둔 기준", "revision": 2, "createdAt": "2026-10-08T06:17:34.768Z", "updatedAt": "2026-10-08T06:17:37.068Z", "url": "https://blog.naver.com/anonymous_workshop/222000000091"}, {"id": "4716ad2d-7e80-4ec8-b989-db5821e5b9a1", "origin": "apple_notes", "title": "일을 잠시 쉬며 만든 하루의 순서", "revision": 1, "createdAt": "2026-10-08T06:17:35.134Z", "updatedAt": "2026-10-08T06:17:35.134Z"}, {"id": "46eecee9-38c2-4d90-a62f-3e2ecb15ee12", "origin": "obsidian", "title": "책 모임에서 질문을 바꾼 날", "revision": 1, "createdAt": "2026-10-08T06:17:35.501Z", "updatedAt": "2026-10-08T06:17:35.501Z"}, {"id": "9dec64ee-b86b-457a-b4d1-a63a9c3f7b85", "origin": "instagram", "title": "좋아하는 산책을 다시 고르다", "revision": 1, "createdAt": "2026-10-08T06:17:35.901Z", "updatedAt": "2026-10-08T06:17:35.901Z", "url": "https://www.instagram.com/p/AnonymousWorkshop/"}, {"id": "d3f7be26-d9bb-4759-bdcf-3fa24c8565f3", "origin": "naver_blog", "title": "일과 취미를 나누어 두는 사람의 이야기", "revision": 1, "createdAt": "2026-10-08T06:17:36.284Z", "updatedAt": "2026-10-08T06:17:36.284Z", "url": "https://blog.naver.com/anonymous_workshop/222000000092"}, {"id": "f482aa44-5972-4a34-acef-b6807da10e2b", "origin": "naver_blog", "title": "지역 독립서점의 글쓰기 모임 안내", "revision": 1, "createdAt": "2026-10-08T06:17:36.684Z", "updatedAt": "2026-10-08T06:17:36.684Z", "url": "https://blog.naver.com/anonymous_workshop/222000000093"}], "versions": [{"id": "6165c059-c8db-4a6c-adc4-ef8727ec6f53", "sourceId": "4427e3a4-c481-4555-bb24-9e36de6fbbcf", "format": "text/plain", "contentText": "첫 면접을 마치고 집으로 돌아왔다. 이름을 아는 회사에서 일하고 싶다는 마음과 내가 오래 잘할 일을 찾고 싶다는 마음이 섞여 있었다.\n\n잘하고 싶다는 마음이 오래 좋아할 조건을 대신하고 있었다. 먼저 일하는 선배의 말을 듣되 내가 매일 반복할 시간을 떠올려 보고 싶다.", "contentHash": "f819bb79a3cad0df97c98a113e2792ab856145336031bdc054611032d17b6dc7", "coverage": {"status": "full_text", "omissions": []}, "originalAuthor": {"label": "", "relation": "self"}, "originalCreatedAt": "2016-03-14", "importedAt": "2026-10-08T06:17:34.768Z", "revision": 1}, {"id": "5184faed-d93a-4b6f-a220-357a94b9148e", "sourceId": "4716ad2d-7e80-4ec8-b989-db5821e5b9a1", "format": "text/plain", "contentText": "일을 쉬기 시작한 첫 주에는 늦게 일어나는 자신을 계속 탓했다. 오전에 가까운 공원을 걷고 점심을 만들어 먹는 순서를 정하니 하루가 조금 선명해졌다.\n\n성과가 없어도 지킨 약속을 적었다. 쉬는 시간에도 나를 돌보는 기준은 자라고 있었다.", "contentHash": "030889c1b3e3e131109554e2fc996bfa3a7d412b57650838102bb4ce95d3270d", "coverage": {"status": "full_text", "omissions": []}, "originalAuthor": {"label": "", "relation": "self"}, "originalCreatedAt": "2019-08-23", "importedAt": "2026-10-08T06:17:35.134Z", "revision": 1}, {"id": "04e9cd64-5d4d-44d1-8034-448e57da8a89", "sourceId": "46eecee9-38c2-4d90-a62f-3e2ecb15ee12", "format": "text/plain", "contentText": "정답을 준비해 가려던 책 모임에서 모른다고 말하는 사람의 이야기를 오래 들었다. 질문을 완성하지 않아도 서로의 경험을 읽을 수 있었다.\n\n잘 아는 사람이 되는 것보다 함께 배우는 사람이 되고 싶다는 생각을 처음 적었다.", "contentHash": "5a58e2abd2069e491b35714e85ee20f06fc53d4886e4f184197444f56a0c6d97", "coverage": {"status": "full_text", "omissions": []}, "originalAuthor": {"label": "", "relation": "self"}, "originalCreatedAt": "2021-11-06", "importedAt": "2026-10-08T06:17:35.501Z", "revision": 1}, {"id": "61bb7fc8-8208-4960-9984-0dc8caef1723", "sourceId": "9dec64ee-b86b-457a-b4d1-a63a9c3f7b85", "format": "text/plain", "contentText": "화면에 잘 나오는 길보다 오래 걷고 싶은 길을 다시 골랐다. 같은 나무를 계절마다 찾아가며 사진을 한 장씩 남긴다🌱\n\n남에게 보여 주는 취향과 실제로 돌보는 취향이 조금 가까워졌다.", "contentHash": "5137df7db9bee58bc9ef55d765d71002cca574389f2b1972f964c86d6ad0df57", "coverage": {"status": "partial", "omissions": ["사진과 댓글 미보관"]}, "originalAuthor": {"label": "", "relation": "self"}, "originalCreatedAt": "2025-04-20", "importedAt": "2026-10-08T06:17:35.901Z", "revision": 1}, {"id": "36a18637-0e3b-46f6-a275-9fe838d5e173", "sourceId": "d3f7be26-d9bb-4759-bdcf-3fa24c8565f3", "format": "text/plain", "contentText": "좋아하는 일을 직업으로 삼지 않아도 괜찮다. 생계를 지탱하는 일과 마음을 쉬게 하는 취미를 분리하면서 오히려 두 가지를 오래 지속할 수 있었다.", "contentHash": "9192da7e8ec3230278145ea27ebcc5068ef9c54f717c0df7994877160eba8521", "coverage": {"status": "partial", "omissions": ["본문 일부와 출처만 보관"]}, "originalAuthor": {"label": "익명 필자", "relation": "other"}, "originalCreatedAt": "2021-05-03", "importedAt": "2026-10-08T06:17:36.284Z", "revision": 1}, {"id": "d1d74dd0-55e3-4c7a-a090-76dd0633b1c4", "sourceId": "f482aa44-5972-4a34-acef-b6807da10e2b", "format": "text/plain", "contentText": null, "contentHash": null, "coverage": {"status": "link_only", "omissions": []}, "originalAuthor": {"label": "", "relation": "unknown"}, "originalCreatedAt": null, "importedAt": "2026-10-08T06:17:36.684Z", "revision": 1}, {"id": "ee8c197e-32bb-44f7-b7ce-88dbdf26a411", "sourceId": "4427e3a4-c481-4555-bb24-9e36de6fbbcf", "format": "text/plain", "contentText": "첫 회사를 돌아보며 다시 쓴 글이다. 회사의 이름보다 함께 배울 동료와 질문할 시간이 더 중요했다. 당시와 지금의 판단을 하나의 결론으로 합치지 않는다.", "contentHash": "1233eaea324a0fa0ac02299b49a4d4f2f5fa36fa93492a35a73bbefeb6736eb6", "coverage": {"status": "full_text", "omissions": []}, "originalAuthor": {"label": "", "relation": "self"}, "originalCreatedAt": "2016-03-14", "importedAt": "2026-10-08T06:17:37.068Z", "revision": 1}]};

  const icon = name => window.HaedoLife.Icons.create(name);
  const button = (label, action, cls = '', glyph) => { const n = el('button', cls); n.type = 'button'; if (glyph) n.append(icon(glyph)); if (!cls.includes('icon-button')) n.append(document.createTextNode(label)); n.setAttribute('aria-label', label); n.title = label; n.addEventListener('click', action); return n; };

  function drawer() {

  }
  function library(main) {

        const n = el('div', 'empty'); n.append(el('h2', '', state.query ? '찾는 책이 없어요' : '아직 엮은 책이 없어요'), el('p', '', state.query ? '다른 제목으로 찾아보세요.' : '지나온 글을 모아 하나의 원고로 읽어보세요. 먼저 예시 책을 열어볼 수 있어요.'), button(state.query ? '검색 지우기' : '예시 책 열기', () => { const opening = !state.query; state.demo = 'normal'; state.query = ''; if (opening) go('read', 0); else render(); }, 'soft', 'book')); entries.append(n); return;

      for (let i = 0; i < count; i++) {
        const entry = el('article', 'book-entry'); const primary = el('div', 'entry-main');
        const title = i ? book.title + ' · 목록 예시 ' + (i + 1) : book.title;
        const bookHeading = el('h2'); bookHeading.append(button(title, () => go('read', 0), 'book-title'));
        primary.append(bookHeading, el('div', 'book-meta', `${book.fromYear}–${book.toYear} · ${book.chapters.length}개 장 · 비공개`));
        const excerpt = el('p', 'book-preview', book.chapters[0].note.split('\n\n')[0]);

        const actions = el('div', 'book-actions'); actions.append(button('전체 읽기', () => go('read', 0), 'soft', 'book'), button('집필', () => go('edit', 0), '', 'edit')); primary.append(actions); entry.append(primary);

  }
  function sourcePanel(chapter) {

      if (version.coverage.omissions.length) n.append(el('div', 'source-meta', version.coverage.omissions.join(' · ')));

      const n = el('section', 'insight'); n.append(el('h3', '', '내 해석'), el('p', '', insight.statement), el('p', 'note', insight.uncertainty));
      const ids = [...(insight.supportVersionIds || []), ...(insight.counterVersionIds || [])];
      if (ids.length) n.append(el('p', 'note', `근거 ${insight.supportVersionIds.length} · 반례 ${insight.counterVersionIds.length} · 자동 분석 아님`)); area.append(n);

  }
  function sourceToggle(chapter) {
    const n = button(`원문 ${chapter.versionIds.length}${state.sources ? ' 접기' : ' 보기'}`, () => { state.sources = !state.sources; const y = scrollY; render(); window.scrollTo(0, y); document.querySelector('#sourcesToggle')?.focus({ preventScroll: true }); }, 'source-button', 'quote'); n.id = 'sourcesToggle'; n.setAttribute('aria-expanded', String(state.sources)); n.setAttribute('aria-controls', 'sourcePanel'); return n;
  }
  function editor(main) {

    if (state.sources) main.classList.add('sources-open'); const col = el('div', 'column');
    const top = el('div', 'chapter-top'); top.append(el('span', 'chapter-count', `${state.chapter + 1} / ${book.chapters.length}장`), sourceToggle(c)); if (state.direction === 'B') top.prepend(mobileChapterPicker()); col.append(top);

  }
  function reading(main) {

      const heading = el('div', 'chapter-heading'); const names = el('div'); names.append(el('span', 'chapter-count', `${i + 1} / ${book.chapters.length}장`), el('h2', '', c.title)); heading.append(names, button(`${i + 1}장 편집`, () => edit(i), 'icon-button soft', 'edit')); section.append(heading);

  }
  function render() {
