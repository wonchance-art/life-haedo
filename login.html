  <body class="platform" data-page="login">
    <svg
      class="icon-defs"
      aria-hidden="true"
      xmlns="http://www.w3.org/2000/svg"
    >
      <defs>
        <symbol id="p-time" viewBox="0 0 32 32">
          <path d="M3 26h26M3 19c5 0 5-10 10-10s5 6 9 6 5-5 7-7" />
          <circle cx="13" cy="9" r="3" />
        </symbol>
        <symbol id="p-goal" viewBox="0 0 32 32">
          <circle cx="16" cy="16" r="11" />
          <circle cx="16" cy="16" r="5" />
          <path d="m16 16 12-12M24 4h4v4" />
        </symbol>
        <symbol id="p-habit" viewBox="0 0 32 32">
          <rect x="5" y="6" width="22" height="22" rx="3" />
          <path d="M11 3v6m10-6v6M5 13h22m-17 7 4 4 8-8" />
        </symbol>
        <symbol id="p-plus" viewBox="0 0 24 24">
          <path d="M12 4v16M4 12h16" />
        </symbol>
        <symbol id="p-check" viewBox="0 0 24 24">
          <path d="m5 12 4 4L19 6" />
        </symbol>
        <symbol id="p-out" viewBox="0 0 24 24">
          <path d="M14 4H5v16h9M10 12h11m-4-4 4 4-4 4" />
        </symbol>
      </defs></svg
    ><a class="skip-link" href="#content">본문으로 이동</a>
    <nav class="p-nav" aria-label="주 메뉴">
      <a class="p-brand" href="index.html" aria-label="해도 홈"
        ><svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M3 24h26M4 20c5 0 5-11 10-11s5 7 9 7 4-5 6-7" /></svg
      ></a>
      <div class="p-nav-links">
        <a href="index.html">홈</a
        ><a href="workspace.html" data-space-link>내 공간</a
        ><a class="p-login-link" href="login.html" data-login-link>로그인</a
        ><button
          class="p-icon-button"
          data-logout
          hidden
          aria-label="로그아웃"
          title="로그아웃"
        >
          <svg aria-hidden="true"><use href="#p-out" /></svg>
        </button>
      </div>
    </nav>
    <main id="content" class="p-main login-main">
      <div class="login-copy">
        <h1>나의 기록을<br />이어가세요.</h1>
        <p>
          Google 계정으로 로그인하고<br />연표, 목표, 습관을 한곳에서
          관리하세요.
        </p>
        <button id="googleLogin" class="p-button google-button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="#4285F4"
              d="M21.6 12.2c0-.7-.1-1.4-.2-2.1H12v4h5.4a4.6 4.6 0 0 1-2 3v2.5h3.3c1.9-1.7 2.9-4.2 2.9-7.4Z"
            />
            <path
              fill="#34A853"
              d="M12 22c2.7 0 5-.9 6.7-2.4l-3.3-2.5c-.9.6-2 1-3.4 1a6 6 0 0 1-5.6-4.2H3v2.6A10 10 0 0 0 12 22Z"
            />
            <path
              fill="#FBBC05"
              d="M6.4 13.9a6 6 0 0 1 0-3.8V7.5H3a10 10 0 0 0 0 9l3.4-2.6Z"
            />
            <path
              fill="#EA4335"
              d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.8A10 10 0 0 0 3 7.5l3.4 2.6A6 6 0 0 1 12 5.9Z"
            /></svg
          ><span>Google로 계속하기</span>
        </button>
        <p
          id="loginMessage"
          class="p-message"
          role="status"
          aria-live="polite"
        ></p>
        <a class="p-text-link" href="index.html">홈으로 돌아가기</a>
      </div>
      <div class="login-art" aria-hidden="true">
        <svg viewBox="0 0 320 320">
          <circle cx="160" cy="160" r="124" />
          <path d="M39 194c55 0 58-94 103-94s42 62 86 62 30-49 57-52" />
          <circle cx="142" cy="100" r="9" />
          <circle cx="142" cy="100" r="4" />
        </svg>
      </div>
    </main>
    <footer class="p-footer">
      <a href="index.html" aria-label="해도 홈">해도</a
      ><span>연표 · 목표 · 습관</span><a href="privacy.html">개인정보 안내</a>
    </footer>
